# ---------------------------------------------------------------------------
# 合并后重建索引（main 上的自动放行闭环）
#
# 这个 workflow 存在的理由：分支保护要求「进 main 必须过 PR、必须过 approve check」，
# 而审核流水线不能再直接往 main 推索引提交（原因见 audit.yml 里 publish job 的长注释：
# 往 PR 分支回写索引会同时踩上「新 sha 的 required check 还没跑完就无法合并」和
# 「删除 pending/** 触发 synchronize 再审核一遍」，两个坑互锁）。
#
# 于是不变式变成：
#   main 的唯一入口 = 合并一个过检的 PR
#   索引 = main 内容的函数（本 workflow 生成，自己开 PR、等 approve 变绿再合并）
#
# 索引改动也走 PR 而不是直接 push，是因为 repo ruleset 不给 GitHub Actions 开 bypass：
# Integration 型 actor 必须是 ruleset source / org 里安装的 App，"App" 又不是合法 actor_type。
# 与其把某个 App 的凭据塞进 Actions（扩大凭据面），不如让「main 上的一切都来自一个过检的 PR」
# 字面为真。防自转靠 PR 标题里的 [skip ci]：squash 合并提交继承该标题，那次 push 不再触发 workflow。
#
# 关键安全点：合并进 main 的 pending JSON 上**没有**审核章。章由本 workflow 盖，
# 而盖之前必须回查证据 —— 查的是那次合并对应 PR 的 head sha 上名为 `approve` 的
# check 的结论（由 scripts/publish-from-main.mjs 执行）。刻意不依赖以下任何一种：
#   * PR 标签：有 triage 权限的人随手就能加一个 auto-approved；
#   * PR 评论：正文里混着投稿者可控文本与模型产出；
#   * 「分支保护肯定配好了」：配置是别人可以改的，而 check 结论改不了。
#
# name 连接点：approve（audit.yml 的 job 名 / publish-from-main.mjs 的 APPROVE_CHECK_NAME）。
# ---------------------------------------------------------------------------

name: Rebuild Index From Main

on:
  push:
    branches:
      - main
    paths:
      - 'pending/**'
      - 'json/modules.json'
      - 'scripts/build-index.mjs'
      - 'scripts/publish-from-main.mjs'
  # Actions 自己合出来的那次 push **不会**触发后续 workflow：GitHub 刻意不让
  # 用 GITHUB_TOKEN 干的事再引发一条链。实测证据 —— 投稿 PR #4 由 publish 作业
  # squash 合并进 main 之后，只有 pages 构建跑了，Rebuild Index From Main 一次都没启动。
  # 所以「自动合并 → 重建索引」这一段必须靠 workflow_run 接上，它是官方留给这条链的口子。
  # 附带的好处：workflow_run 跑的是**默认分支上的这份 YAML**，投稿者的 PR 改不动
  # 「决定能不能进索引」的那段逻辑。
  workflow_run:
    workflows: ['Module Submission Audit']
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: '按哪一次 main 上的提交来认定 PR（留空=本次推送；重试旧投稿时填那次的 sha）'
        required: false
      dry_run:
        description: '只判定与盖章，不提交索引'
        type: boolean
        required: false
        default: false

# 串行：这个 job 写 main，两个并发 run 会互相踩索引文件与 pending 删除。
# cancel-in-progress 必须是 false —— 中途取消会留下「runner 里已盖章、main 上未提交」的
# 半截判断，而下一次 run 看到的还是旧的。
concurrency:
  group: index-main
  cancel-in-progress: false

permissions:
  # contents 只要 read：这个 workflow 不再 git push（改动交给 App 写），
  # 留着 write 等于揣着一把用不上的钥匙。
  contents: read
  checks: read         # 取 approve 的结论
  pull-requests: write # 合并索引 PR + 把结果贴回 PR

jobs:
  index:
    name: Stamp And Rebuild
    runs-on: ubuntu-latest
    # 由 workflow_run 触发时只跟「审核跑成功」的那次：审核红了的运行里没有获批准的投稿，
    # 让它在 main 上扫一遍只会白白开一个空转的索引 PR。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # 要 diff-tree 出这一次提交改了哪些 pending，所以必须拿到那个提交本身。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 定位仓库结构与本次认定的提交
        id: layout
        shell: bash
        env:
          FORCE_PREFIX: ${{ vars.MODULE_REPO_PREFIX || '' }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          PUSHED_SHA: ${{ github.event.after }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PREFIX="$FORCE_PREFIX"
          if [ -z "$PREFIX" ] && [ -d contrib/repo/pending ]; then PREFIX="contrib/repo"; fi
          PENDING_DIR="${PREFIX:+$PREFIX/}pending"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "pending_dir=$PENDING_DIR" >> "$GITHUB_OUTPUT"
          echo "index_file=${PENDING_DIR%pending}json/modules.json" >> "$GITHUB_OUTPUT"
          echo "scripts_dir=${PENDING_DIR%pending}scripts" >> "$GITHUB_OUTPUT"

          # dispatch 填的 sha 优先；push 用 after；其余兜到当前 head。
          SHA="${INPUT_SHA:-${PUSHED_SHA:-$HEAD_SHA}}"
          SHA="${SHA//[^0-9a-fA-F]/}"   # 只当十六进制串处理，外部文本不能进后面的命令
          if [ "${#SHA}" -lt 40 ]; then echo "::error::拿不到合法的提交号"; exit 1; fi
          git cat-file -e "${SHA}^{commit}" || { echo "::error::${SHA} 不在这个仓库里"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # 只认定「这一个提交带进 main 的、此刻仍然存在的 pending 文件」。
          # 两个限制都是有意的：
          #  * --diff-filter=ACMR 排除删除 —— 索引消费掉 pending 的那次提交全是删除，
          #    把已删除的路径交给盖章脚本只会读不到文件而报错；
          #  * 不做全目录扫描 —— main 上可能留着历史里没批下来的条目，按「最近一次合并
          #    的批准」给它们盖章等于借章。
          git diff-tree -r --no-commit-id --name-only --diff-filter=ACMR "$SHA" -- "$PENDING_DIR" \
            | sed "s#^#${GITHUB_WORKSPACE}/#" > changed.txt || true
          echo "changed_count=$(grep -c . changed.txt || true)" >> "$GITHUB_OUTPUT"
          echo "本次提交带入/改动的 pending 文件："
          cat changed.txt

      - name: 盖章（回查 approve 的结论）
        id: stamp
        # 本次认定的提交没带入任何 pending 时**不要**跑盖章：脚本把「没传 --changed」
        # 理解成「不限范围 = 全部 pending」，而 workflow_run 触发之后 index.yml 会在每一次
        # 审核成功后都跑一遍，于是某条只改了 workflow 的维护 PR 会拿自己那次 approve 的
        # 结论，把 main 上所有还没消费的 pending 全部盖章 —— 借章。
        # 老投稿要重试请用 workflow_dispatch 的 sha 输入，别靠这种巧合。
        if: steps.layout.outputs.changed_count != '0'
        # 未获批准时后面几步全部跳过，但结果仍要贴回 PR，所以这里不直接让 job 红；
        # 判红留在最后一步。
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.layout.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PENDING_DIR: ${{ steps.layout.outputs.pending_dir }}
          SCRIPTS_DIR: ${{ steps.layout.outputs.scripts_dir }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--pending "$PENDING_DIR" --sha "$SHA" --owner "$OWNER" --repo "$REPO"
                --report publish-from-main.report.json)
          # --changed 只在真有改动时传：不传 = 脚本按「全部 pending」处理，
          # 而空列表会被它当成范围限制，一个都不盖。
          if [ -s changed.txt ]; then
            while IFS= read -r p; do
              [ -n "$p" ] && ARGS+=(--changed "$p")
            done < changed.txt
          fi
          if [ "${DRY:-}" = "true" ]; then ARGS+=(--dry-run); fi
          node "$SCRIPTS_DIR/publish-from-main.mjs" "${ARGS[@]}"

      - name: 合并进索引（build-index.mjs）
        if: steps.stamp.outcome == 'success'
        shell: bash
        env:
          PENDING_DIR: ${{ steps.layout.outputs.pending_dir }}
          INDEX_FILE: ${{ steps.layout.outputs.index_file }}
          SCRIPTS_DIR: ${{ steps.layout.outputs.scripts_dir }}
        run: |
          set -euo pipefail
          set +e
          # --consume 清掉已合并的 pending：不清它们就永久留在仓库里、每次重跑重复处理。
          # 安全前提：build-index.mjs 在有冲突/非法条目时自己跳过删除，不会在冲突未解决时丢数据。
          node "$SCRIPTS_DIR/build-index.mjs" --pending "$PENDING_DIR" --index "$INDEX_FILE" --consume 2>&1 | tee build-index.log
          # 管道里 $? 拿到的是 tee 的退出码，必须用 PIPESTATUS[0] 取 node 自己的，
          # 否则 BUILD_RC 恒为 0，回帖会把「有冲突」说成「已入索引」。
          echo "build_rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e

      - name: 校验索引（validate-index.mjs）
        if: steps.stamp.outcome == 'success'
        shell: bash
        env:
          INDEX_FILE: ${{ steps.layout.outputs.index_file }}
          SCRIPTS_DIR: ${{ steps.layout.outputs.scripts_dir }}
        run: |
          set -euo pipefail
          # 宁可不进索引，也不进坏索引：过不了校验就不提交。
          node "$SCRIPTS_DIR/validate-index.mjs" "$INDEX_FILE"

      # -------------------------------------------------------------------
      # 把改动集交给 Worker，由 GitHub App 开索引 PR —— 这一步不是可选的复杂度。
      #
      # 为什么不能在这里 `git push` + `gh pr create`（两条都是实测撞上的）：
      #   1. org `SukiSU-Community` 禁止 GitHub Actions 创建/批准 PR：
      #      `pull request create failed: GraphQL: GitHub Actions is not permitted to
      #      create or approve pull requests`，仓库级同名开关 PATCH 返回 409
      #      「The organization does not allow ...」；
      #   2. 机器人写的提交**不触发** pull_request 检查：Actions 推上来的索引分支开成 PR 后
      #      `no checks reported`（`gh pr checks` 空），而人工补一个自己名下的提交后检查立刻跑。
      #      没有 `approve`，ruleset 就永远不放行合并 —— 索引 PR 会卡成死局。
      #
      # App 名下的提交两个问题都没有：投稿 PR #4 就是它开的，audit/derive/approve 照常跑。
      # 所以分工是：Actions 盖章 + 算索引 + 校验（凭据仍在它自己手里，够不着 GitHub 写入），
      # Worker 用 App 身份写分支开 PR，Actions 再等绿并合并。
      #
      # 环不会自转：标题带 [skip ci]（Worker 端还会兜底补一次），squash 后的合并提交继承它。
      # -------------------------------------------------------------------
      - name: 把改动集交给 Worker，由 App 开索引 PR
        id: openpr
        if: steps.stamp.outcome == 'success' && github.event.inputs.dry_run != 'true'
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          INDEX_FILE: ${{ steps.layout.outputs.index_file }}
          PENDING_DIR: ${{ steps.layout.outputs.pending_dir }}
          SCRIPTS_DIR: ${{ steps.layout.outputs.scripts_dir }}
          SHA: ${{ steps.layout.outputs.sha }}
          WORKER_URL: ${{ vars.SUBMIT_WORKER_URL }}
          # 走 env 不走命令行：命令行参数会出现在 runner 的进程列表与日志回显里
          REBUILD_TOKEN: ${{ secrets.REBUILD_TOKEN }}
        run: |
          set -euo pipefail
          # 没有变化就不开 PR —— 空 PR 会让「每个索引改动都来自 PR」这条叙事变脏。
          if git diff --quiet HEAD -- "$INDEX_FILE" "$PENDING_DIR" \
             && [ -z "$(git status --porcelain -- "$INDEX_FILE" "$PENDING_DIR")" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "索引与 pending 都没有变化，不开 PR。"
            exit 0
          fi
          if [ -z "${WORKER_URL:-}" ]; then
            echo "::error::没配仓库变量 SUBMIT_WORKER_URL（投稿 Worker 的 https 地址），开不出索引 PR。"
            echo "::error::索引没更新，但改动已算好：配上变量后重跑本 workflow（或 dispatch 填 sha）即可。"
            exit 1
          fi
          BRANCH="index/rebuild-${RUN_ID}"
          node "$SCRIPTS_DIR/open-index-pr.mjs" \
            --root "$GITHUB_WORKSPACE" \
            --worker "$WORKER_URL" \
            --branch "$BRANCH" \
            --base-sha "$SHA" \
            --out-file pr-url.txt \
            --body "$(cat <<'BODY'
          索引重建，由 `Rebuild Index From Main` 生成，提交由投稿 Worker 的 GitHub App 写出。

          审核章的证据不在这里，而在被合并的那个投稿 PR 上：`approve` check 在其
          head sha 上为 success。要复核就顺着 pending 条目里的 `audit.verify` 命令查。

          本 PR 的内容必须是 `build-index.mjs` 对 base 的推导结果 —— `derive` 步骤会自己
          重算一遍并逐字段比对；对不上就判红。人工想改索引请改代码或走 revoke 流程，
          不要手改 `json/modules.json`。
          BODY
          )"
          URL=$(cat pr-url.txt)
          echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: 等 approve 变绿并合并
        if: steps.openpr.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.openpr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # --watch blocking：任何一个 required check 失败都会让这里非 0 退出，
          # 于是这个 run 红、PR 留着给人看 —— 而不是「静默合了一个没过检的索引改动」。
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --interval 15
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash

      - name: 把结果贴回 PR
        if: always()
        uses: actions/github-script@v7
        env:
          STAMP_OUTCOME: ${{ steps.stamp.outcome }}
          BUILD_RC: ${{ steps.build.outputs.build_rc }}
          SHA: ${{ steps.layout.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            let rep = {};
            try { rep = JSON.parse(fs.readFileSync('publish-from-main.report.json', 'utf8')); } catch {}
            if (!rep.pr) {
              // 反查不到 PR 时只在本 run 里说明，不去猜该通知谁。
              core.notice('report 里没有 PR 号，跳过回帖；原因见上一步日志。');
              return;
            }
            if (process.env.STAMP_OUTCOME === 'success' && rep.reason === 'no-pending') return;

            const log = fs.existsSync('build-index.log') ? fs.readFileSync('build-index.log', 'utf8') : '';
            const MAX = 20000;
            let body;
            if (process.env.STAMP_OUTCOME !== 'success') {
              body = `## 索引未更新\n\n`
                + `这次合并带进 \`main\` 的 pending 条目**没有**被盖审核章，因此不会进正式索引。\n\n`
                + `- 原因：${rep.reason || '(publish-from-main 没给原因，见该 run 日志)'}\n`
                + `- 认定的提交：\`${process.env.SHA}\`\n\n`
                + `要么让该 PR 上名字为 \`approve\` 的 check 变成 success 后重跑本 workflow，`
                + `要么走人工双签盖章（见 GOVERNANCE.md）。这里不做「看起来像通过了就盖」。`;
            } else {
              const rc = process.env.BUILD_RC || '0';
              body = `## 索引已重建\n\n`
                + `- 盖章依据：\`approve\` check 在 \`${rep.headSha || process.env.SHA}\` 上为 success（PR #${rep.pr}）\n`
                + `- 盖章的 id：${(rep.ids || []).map((x) => '`' + x + '`').join('、') || '（无新条目）'}\n`
                + `- build-index.mjs 退出码：\`${rc}\`${rc === '0' ? ' ✅' : ' ⚠️ 有冲突/非法条目，见下面输出'}\n\n`;
              if (log) {
                body += `<details><summary>build-index.mjs 输出</summary>\n\n\`\`\`\n`
                  + (log.length > MAX ? log.slice(0, MAX) + '\n…（已截断）' : log) + '\n```\n</details>';
              }
            }
            await github.rest.issues.createComment({
              issue_number: rep.pr, owner: context.repo.owner, repo: context.repo.repo, body,
            });

      - name: 未获批准时让本 run 红
        if: steps.stamp.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::publish-from-main 拒绝盖章：原因见上一步与 PR 上的说明。"
          echo "模块不会进正式索引 —— 这不是可以忽略的告警。"
          exit 1
