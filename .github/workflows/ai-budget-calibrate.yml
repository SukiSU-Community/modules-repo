# ---------------------------------------------------------------------------
# AI 预算标定（一次性，人工触发）
#
# 为什么需要这一步：`audit/ai-review.mjs` 里的 `DEFAULT_MAX_BRIEF_BYTES = 240000`
# 是一个**没有依据的保守代理值**（评审 F4）。它需要由一次真跑的成本读数来撑住。
#
# ⚠️ 2026-10-27 修正：这个 workflow 原先要产出 `input_tokens / neededBytes` 这个比值，
#    那是**做不到**的 —— QCA 不给 token 数。供应商文档两处原文：
#      · `shared/events.md`：spans expose **no token counts** or internal timing
#      · `shared/tools-and-resources.md`：Model spend is reported as **credits, not tokens**
#      · `GET /sessions/{id}` 只有 `usage.total_credits` 与 `stats`，无 token 字段
#    也没有任何官方 credits↔token 换算口径。所以现在的产出改成**两个实测值之比**：
#      · credits / neededBytes（credits per KB）—— 分子分母都是真读出来的，不含假设
#      · 按单发 credits 上限线性外推的字节预算（唯一假设是「字节翻倍花费大致翻倍」）
#    再拿这个字节预算去定 `AI_BRIEF_MAX_BYTES`。**不产出任何 token 系数** —— 无从测起。
#
# 这个 workflow 只做一件事：拿一枚真包真发一次，把上面两个数打印到 job summary 里。
# 它**不改任何代码、不写任何仓库文件**：标定是运维动作，改代码要走 PR。
#
# ⚠️ 这里的花费是真钱：一次 qca 会话按 usage.total_credits 计费（实测 10~13 credits 一发）。
#    所以只有 workflow_dispatch，没有 push / schedule 触发。
#
# ⚠️ 拿不到读数的三种情形（没有产物 / 会话不是终态 / 没有 total_credits）**必须红**，
#    不许打印一个编出来的数：这个 job 的唯一产出就是两个数，编一个数比不产出更糟。
# ---------------------------------------------------------------------------

name: AI Budget Calibrate

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: '要标定的模块 zip 路径（相对仓库根）。留空则现场生成体量对位的探针包'
        required: false
        default: ''
        type: string
      probe_text_bytes:
        description: '现场生成探针时的目标文本字节数（真包约 766 KB，默认 780000）'
        required: false
        default: '780000'
        type: string
      index_path:
        description: '用于判定首次收录/版本更新的索引路径（留空则不传，changeType 会退化为 unknown）'
        required: false
        type: string
      credits_ceiling:
        description: '一发允许花的 credits 上限（用来反推字节预算，默认 15 —— 实测一发 10~13）'
        required: false
        default: '15'
        type: string

permissions:
  contents: read

jobs:
  calibrate:
    name: Calibrate AI brief budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 标定的前提是凭据齐。缺任何一件就直接红 —— 这一发的产物就是那个比值，
      # 没有凭据就没有比值，「跳过」在这里等于什么都没做却显示成功。
      - name: 检查凭据
        env:
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QCA_AGENT_ID: ${{ vars.QCA_AGENT_ID }}
          QCA_AGENT_VERSION: ${{ vars.QCA_AGENT_VERSION }}
          QCA_ENVIRONMENT_ID: ${{ vars.QCA_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          MISSING=""
          for k in QODER_PAT QCA_AGENT_ID QCA_AGENT_VERSION QCA_ENVIRONMENT_ID; do
            [ -n "${!k:-}" ] || MISSING="$MISSING $k"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::标定需要凭据，缺：${MISSING# }。没有凭据就没有可真跑的一发，这一发不许绿。"
            exit 1
          fi

      # 标定要一枚真包。zip 不在仓库里（`.gitignore` 有 `*.zip`，`scripts/audit-corpus.mjs:18`
      # 写明下载的 zip 一律落在仓库外），所以默认**现场生成**一枚体量对位的探针：
      #   · 不为这一次运行往 git 历史里塞一个几百 KB 的二进制；
      #   · 也不必为它开一条 `!calibration/*.zip` 的 ignore 例外（开了例外，以后「哪个 zip
      #     能进仓」就变成要逐个记住的事）。
      # 探针的体量必须落在真实工作点 —— 理由见 audit/calibration-probe.mjs 文件头。
      # 想标定一枚真包时传 zip_path 覆盖这个默认。
      - name: 准备标定的包（默认现场造探针）
        id: pack
        env:
          ZIP_INPUT: ${{ inputs.zip_path }}
          PROBE_BYTES: ${{ inputs.probe_text_bytes }}
        run: |
          set -euo pipefail
          ZIP_PATH="${ZIP_INPUT:-}"
          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH="audit-probe.zip"
            node audit/calibration-probe.mjs --out "$ZIP_PATH" --text-bytes "${PROBE_BYTES:-780000}"
          fi
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::找不到 zip：${ZIP_PATH}（这个路径要相对仓库根，且必须在本次 checkout 里）"
            exit 1
          fi
          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      # 先用同一套扫描器产出一份报告：ai-review.mjs 的 brief 是从报告 + 包内条目组装的，
      # 直接拿一份手写报告会让标定的比值与线上那条路不是同一件事。
      - name: 扫一遍（产出 brief 的输入）
        env:
          ZIP_PATH: ${{ steps.pack.outputs.zip }}
          INDEX_PATH: ${{ inputs.index_path }}
        run: |
          set -euo pipefail
          mkdir -p audit-out
          ARGS=(--out-dir audit-out)
          if [ -n "${INDEX_PATH:-}" ] && [ -f "$INDEX_PATH" ]; then
            ARGS+=(--index "$INDEX_PATH")
          fi
          # 包路径是**位置参数**，不是 --zip（scan.mjs 没有 --zip 这个开关）。
          # 2026-10-27 修：这里原先写成 `--zip "$ZIP_PATH"`，scan.mjs 只打印了一屏用法就
          # 正常退出（退出码 0），`ls -l audit-out` 显示空目录、这一步仍然是绿的 —— 于是
          # 下一步报「--report 指向的文件不存在」，看上去像 ai-review.mjs 的问题，
          # 实际是这里从来没真跑通过一次。找不到产物就必须当场红。
          node audit/scan.mjs "$ZIP_PATH" "${ARGS[@]}"
          ls -l audit-out
          # 空目录不算跑过：scan.mjs 认不出参数时正是以「打印用法 + 退出 0」收场。
          ls audit-out/*.audit.json > /dev/null 2>&1 || {
            echo "::error::scan.mjs 没有产出任何 *.audit.json（audit-out 是空的）—— 参数或包有问题，标定无法继续。"
            exit 1
          }

      # 算出「装下整包需要多少字节」。下一步拿它当 --max-bytes，让那一发真的把整包发出去。
      # 为什么必须算而不是让 ai-review 自己决定：不传 --max-bytes 时它会退回默认 240000，
      # 「不设预算」不等于「不设上限」—— 真包/探针动辄 800 KB，会直接走 over-budget、
      # 压根不调用模型，读数一个都没有（2026-10-27 实测踩过）。
      - name: 算 neededBytes（下一发的预算上界）
        id: budget
        env:
          ZIP_PATH: ${{ steps.pack.outputs.zip }}
        run: |
          set -euo pipefail
          BASE=$(basename "$ZIP_PATH")
          node audit/calibration-budget.mjs "audit-out/$BASE.audit.json" "$ZIP_PATH" > budget.json
          cat budget.json
          # 用 node 校验而不是 `[ "$NEEDED" -le 0 ]`：后者在 NEEDED 不是数字时返回 2，
          # 被 if 当成「条件不成立」放过去 —— 一个读不懂的值会被当合法值传进预算。
          NEEDED=$(node -e "
            const b = require('./budget.json');
            const n = Number(b.neededBytes);
            if (!Number.isFinite(n) || n <= 0) {
              console.error('::error::budget.json 里的 neededBytes 不是正数：' + JSON.stringify(b.neededBytes));
              process.exit(1);
            }
            process.stdout.write(String(n));
          ")
          echo "needed=$NEEDED" >> "$GITHUB_OUTPUT"

      # 真发一次。**必须显式给一个足够大的 --max-bytes**：
      # 标定要量的是「装下整包需要花多少 credits」，所以这一发必须真的把整包发出去。
      # 2026-10-27 实测踩到的坑：原先这里没有传 --max-bytes，注释写着「故意不设预算」——
      # 但不设预算 ≠ 不设上限，ai-review.mjs 会退回 DEFAULT_MAX_BRIEF_BYTES（240000）。
      # 体量对位的探针需要 815067 B，于是这一发直接走了 over-budget 分支、**压根没调用模型**，
      # 状态是 over-budget、拿不到任何 credits 读数。标定因此必须自己把上限抬到 neededBytes 之上。
      - name: 真发一次（这一步会计费）
        id: fire
        env:
          ZIP_PATH: ${{ steps.pack.outputs.zip }}
          NEEDED: ${{ steps.budget.outputs.needed }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QCA_AGENT_ID: ${{ vars.QCA_AGENT_ID }}
          QCA_AGENT_VERSION: ${{ vars.QCA_AGENT_VERSION }}
          QCA_ENVIRONMENT_ID: ${{ vars.QCA_ENVIRONMENT_ID }}
          QCA_PROMPT_SHA: ${{ vars.QCA_PROMPT_SHA }}
        run: |
          # runner 的 `shell: bash` 带 -e，任何非 0 都会当场打断 —— 而这一发**允许**非 0
          # （over-budget / failed 都是有信息量的结果：至少 neededBytes 出来了）。
          # 所以这里显式收退出码，由下一步决定该红还是该继续。
          set -uo pipefail
          BASE=$(basename "$ZIP_PATH")
          ARGS=(run --report "audit-out/$BASE.audit.json" --zip "$ZIP_PATH"
                --out "audit-out/ai-$BASE.json" --status "audit-out/ai-$BASE.status"
                --max-bytes "$NEEDED")
          if [ -n "${QCA_PROMPT_SHA:-}" ]; then
            ARGS+=(--expected-prompt-sha "$QCA_PROMPT_SHA")
          fi
          CODE=0
          node audit/ai-review.mjs "${ARGS[@]}" || CODE=$?
          echo "退出码：$CODE（状态：$( [ -f "audit-out/ai-$BASE.status" ] && tr -d '\r\n' < "audit-out/ai-$BASE.status" || echo '<没写出>' )）"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: 打印读数（拿不到就红，不许编一个数）
        env:
          BASE: ${{ steps.fire.outputs.base }}
          CODE: ${{ steps.fire.outputs.code }}
          CREDITS_CEILING: ${{ inputs.credits_ceiling }}
        run: |
          set -euo pipefail
          OUT="audit-out/ai-${BASE}.json"
          if [ ! -f "$OUT" ]; then
            echo "::error::ai-review.mjs 没写出产物 ${OUT}（退出码 ${CODE}）：这一发没有可读的读数，标定失败。"
            exit 1
          fi
          node - "$OUT" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          const a = JSON.parse(fs.readFileSync(p, 'utf8'));
          const b = (a && a.brief) || {};
          const meta = (a && a.meta) || {};
          const tgt = (a && a.target) || {};
          // 可读读数只有这三样（供应商文档：spans 不给 token 数，花费以 credits 计）。
          // 别再找 input_tokens —— GET /sessions/{id} 根本没有这个字段，见 ai-review.mjs 文件头。
          const credits = meta.totalCredits ?? null;
          const secs = meta.activeSeconds ?? null;
          const status = meta.sessionStatus ?? null;
          const needed = b.neededBytes ?? null;
          const byteSize = b.byteSize ?? null;
          const maxBytes = b.maxBytes ?? null;
          const ceilingRaw = process.env.CREDITS_CEILING || '15';
          const ceiling = Number(ceilingRaw);

          const lines = [];
          lines.push('## AI 预算标定读数');
          lines.push('');
          lines.push(`- 包：\`${tgt.zip || '<产物里没记>'}\``);
          lines.push(`- 状态：\`${a.status || '<无>'}\``);
          lines.push(`- brief 实际送出（byteSize）：**${byteSize}** B`);
          lines.push(`- 装下整包需要（neededBytes）：**${needed}** B`);
          lines.push(`- 本次生效预算（maxBytes）：${maxBytes} B`);
          lines.push(`- 会话状态：${status ?? '<读不到>'}（不是终态时下面的成本只是截至那一刻）`);
          lines.push(`- total_credits：${credits ?? '<读不到>'}`);
          lines.push(`- active_seconds：${secs ?? '<读不到>'}`);
          lines.push('');

          // 会话没跑完时读到的花费是「截至那一刻」，用它定预算会偏小 —— 这一发必须重跑。
          const TERMINAL = new Set(['idle', 'completed', 'failed', 'canceled', 'cancelled', 'stopped']);
          if (typeof status !== 'string' || !TERMINAL.has(status)) {
            lines.push('### ⛔ 标定失败：会话不是终态');
            lines.push('');
            lines.push(`读到 status=\`${status ?? '<空>'}\`。花费还在涨的时候取数，等于把中间值当终值，`);
            lines.push('据此定出来的预算会偏小、上线后把正常包判成 over-budget。等会话结束再跑一次。');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.error(`::error::标定失败：会话状态不是终态（${status ?? '<空>'}）`);
            process.exit(1);
          }

          if (!Number.isFinite(Number(credits)) || Number(credits) <= 0) {
            lines.push('### ⛔ 标定失败：读不到 total_credits');
            lines.push('');
            lines.push('credits 是供应商唯一可靠报告的花费读数（`usage.total_credits`）。');
            lines.push('拿不到它时**不许**用一个假设的系数凑一个数出来 —— 后人会拿它去定预算，');
            lines.push('而一个编出来的比值与「没标定」相比更危险（它看起来像事实）。');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.error('::error::标定失败：产物里没有可用的 meta.totalCredits');
            process.exit(1);
          }

          if (!Number.isFinite(Number(needed)) || Number(needed) <= 0) {
            lines.push('### ⛔ 标定失败：产物里没有 neededBytes');
            lines.push('');
            lines.push('分母读不出来，比值无从谈起 —— 与读不到 credits 同一句话：不许凑。');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.error('::error::标定失败：产物里没有 brief.neededBytes');
            process.exit(1);
          }

          if (!Number.isFinite(ceiling) || ceiling <= 0) {
            lines.push('### ⛔ 标定失败：credits_ceiling 不是正数');
            lines.push('');
            lines.push(`读到 \`${ceilingRaw}\`。这个输入用来反推字节预算，必须是一个正数。`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            console.error(`::error::标定失败：credits_ceiling 非法（${ceilingRaw}）`);
            process.exit(1);
          }

          // credits per KB —— 这是两个**实测可读**字段之比，不含任何假设。
          const creditsPerKb = Number(credits) / (Number(needed) / 1024);
          // 给一个可直接抄进 workflow 的字节预算：把「一发允许花多少 credits」按同一比例摊到字节上。
          // 这一步是**线性外推**（唯一的输入就是这份 brief，字节翻倍花费大致也翻倍），
          // 不是 token 换算 —— 供应商不提供 token 数，任何 token 系数都无从测起。
          const safeBytes = Math.floor(Number(ceiling) / Number(credits) * Number(needed));
          lines.push('### 读数');
          lines.push('');
          lines.push(`- \`credits / neededBytes\` = **${creditsPerKb.toFixed(6)}** credits/KB（两个实测值之比，无假设）`);
          lines.push(`- 按单发 ${ceiling} credits 上限线性外推的字节预算：**${safeBytes}** B`);
          lines.push(`  （即把 \`AI_BRIEF_MAX_BYTES: '${safeBytes}'\` 写进 audit.yml 的 AI 步 env）`);
          lines.push('');
          lines.push('⚠️ 这是**一次**标定。两者之比随内容（行号前缀、中英混排、压缩率）漂移，');
          lines.push('   所以别把它当成永久系数：换模型、换 prompt 形状、或线上出现 over-budget 误报时重跑一次。');
          lines.push('');
          lines.push('📌 关于 token：供应商的 spans「不暴露 token 数」、花费「以 credits 计」，');
          lines.push('   `GET /sessions/{id}` 也没有 token 字段，因此本标定**不产出任何 token 系数**。');
          lines.push('   真要按 token 卡，只能等供应商把 token 数露出来。');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
