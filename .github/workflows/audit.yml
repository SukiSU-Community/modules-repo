# 模块投稿安全审核流水线
#
# ⚠️ 这里是仓库里**实际生效**的那一份。母本在 monorepo 的 contrib/audit/workflows/audit.yml，
#    两份只差开头 4 行标题。改了这份必须同步母本，否则下一次复制回去会把修过的东西冲掉（对齐由 repo/test/verify-pending-proof.test.mjs 钉住）。
#
# 触发：**每一个** PR 都要跑（不能加 paths 过滤，原因见下面 on: 里的说明）。
#
# ⚠️ 关键前提：Worker 开的 PR 里**只有元数据 JSON**（pending/<id>/<versionCode>.json），
#    zip 本体在 GitHub Release asset 上（见 contrib/worker/src/index.ts openPendingPr）。
#    所以本流水线不能靠 `git diff --name-only -- '*.zip'` 找待审 zip —— 那样永远找不到。
#    正确顺序是：定位新增的 pending/**/*.json -> 读里面的 zipUrl（或 releaseTag+assetName）
#    -> 下载 zip -> 再交给 scan.mjs 扫描。
#
# 路径约定：本模板在两种不同的落地形态下都要能跑，所有路径统一由 REPO_PREFIX 推导：
#   1. 索引仓库（pending/ 在仓库根）              -> REPO_PREFIX 为空
#   2. 当前 monorepo（索引仓库在 contrib/repo/）  -> REPO_PREFIX=contrib/repo
# 用 vars.MODULE_REPO_PREFIX 覆盖，或让下面的探测逻辑自己认。
#
# 决策矩阵（已定案）：
#   低风险 + 首次收录        -> auto-approved，自动合入索引
#   低风险 + 版本更新        -> needs-human-review，请求人工（不自动合入）
#   中/高风险（任何变更类型）-> needs-human-review，阻止自动合入
#   审核不通过的内容绝不出现在正式索引里。
#
# AI 安全员（Task 6.1）：QCA 四件（QODER_PAT / QCA_AGENT_ID / QCA_AGENT_VERSION /
# QCA_ENVIRONMENT_ID）**齐了才发这一发**，缺任何一件逐包写 disabled 且不调用脚本 ——
# 少配一项不退化成「用 latest」，也不整步不跑（那正是「绿勾 + 这一层根本没参与」的形态）。
# 送出去的是**整包原文**：「只送结构化投影」那层输入侧防护由用户 2026-10-13 撤销（D5b），
# 所以投稿者可控的文本会进模型 —— 这是本流水线的前提，不是疏漏。防注入整个搬到输出侧，
# 三根柱子缺一根这道闸就是可被投稿者遥控的：
#   ① AI 只能抬级、永远无权放行（D3）：注入成功的最好结果是队列变长；
#   ② schema 严格校验 + 每条 file/line/quote 逐字对上「送出去的那一份」原文（D4），
#      任一条不合格整份不采信，而不是丢掉那一条继续盖章；
#   ③ 模型的自由文本进 PR 评论前封条数与单条长度（分流决策里，改这一步时必须保留）。
# 五种状态（disabled / ok / failed / untrusted / over-budget）由 AI 步逐包写进
# audit-out/ai-<zip basename>.status，由「分流决策」消费：failed / untrusted / over-budget
# 各用自己那句串、整步红；ok 参与 raiseLevel 抬级；disabled 等级不动。
# 判自动放行的地方全仓只有一处（分流决策里的 decide），这一步不产出 action。

name: Module Submission Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # 这里**不能有 paths 过滤**，它是被一次真实的卡死换来的：配了 required_status_checks
    # （context=approve）之后，「这个 check 从来没跑过」和「它失败了」对 GitHub 是同一件事
    # —— PR 永远 BLOCKED。而带 paths 的版本只认 pending/**、json/**，于是改 scripts/ 或
    # 文档的维护 PR 根本不会触发审核：PR #5 就是这样卡住的
    # （gh pr checks 5 → no checks reported；gh pr view → mergeStateStatus BLOCKED）。
    # 结论：approve 必须在**每一个** PR 上都存在。非投稿的 PR 由 locate 输出 found=false、
    # approve 走「没有待审投稿内容 → 无批准事项」那条分支放行，而不是靠不触发来放行。
    #
    # 反过来，json/** 的改动绝不能因为「没有投稿内容」就直接放行 —— 手抄 json/modules.json
    # 正是要挡的路径，它走 kind/derive 两步的推导判定（见 approve 里的先后顺序）。
  workflow_dispatch:
    inputs:
      zip:
        description: '要扫描的模块 zip 路径（留空则按 PR 的 pending/*.json 自动定位）'
        required: false
        type: string

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # 索引 PR 的批准证据要从 check runs 里取（verify-index-pr.mjs 复用
  # publish-from-main 的 findPrForCommit），所以这里也要读得到 checks。
  checks: read
  issues: write

jobs:
  audit:
    name: Scan & Triage
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.triage.outputs.risk }}
      action: ${{ steps.triage.outputs.action }}
      label: ${{ steps.triage.outputs.label }}
      change_type: ${{ steps.triage.outputs.change_type }}
      needs_human_review: ${{ steps.triage.outputs.needs_human_review }}
      module_id: ${{ steps.triage.outputs.module_id }}
      module_version: ${{ steps.triage.outputs.module_version }}
      reasons: ${{ steps.triage.outputs.reasons }}
      # found=false 表示「这个 PR 里没有待审投稿内容」（比如只是删除 pending，
      # 或改的是 scripts/docs）。它必须和「审过但不通过」区分开：前者没有批准事项，
      # 后者才有 —— 混在一起会让维护类 PR 永远卡在一个不会变绿的 required check 上。
      found: ${{ steps.locate.outputs.found }}
      # 索引重建 PR 走的是另一条判据：内容必须由 base 推导得出（见 kind/derive 两步）。
      index_pr: ${{ steps.kind.outputs.index_pr }}
      index_derived: ${{ steps.derive.outputs.derived }}
      # 动了处置台账的 PR 是第三种形状：既不是「索引重建」也不是「没有内容要判」，而是一次人的决定。
      # 这两个必须分开导出 —— 合成一个就会退成「台账改动也算索引 PR」，那正是 2026-10-17 复现打穿的形状。
      ledger_pr: ${{ steps.kind.outputs.ledger_pr }}
      ledger_sealed: ${{ steps.derive.outputs.sealed }}
      # 处置台账（下架/黑名单）在 CI 侧的那一道：hit / clear（见 dispose 步）。
      disposition: ${{ steps.dispose.outputs.hit }}
      disposition_reason: ${{ steps.dispose.outputs.why }}
    steps:
      - name: Checkout PR 分支
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------------
      # 0. 把「决定结论的东西」钉回 base 版本
      #
      #    为什么必须有这一步：上面那次 checkout 拿的是 PR 分支，而 scan.mjs /
      #    risk-rules.mjs / build-index.mjs / json/modules.json 全都从这棵工作树里读。
      #    于是「谁能往 PR 里塞一份改过的扫描器」= 「谁能决定自己的风险等级」。
      #    外部投稿人今天塞不进来（Worker 的 PR 只写一个 pending JSON，
      #    sanitizeSegment 也挡住了路径穿越），但这个闸要开放给公开招募的贡献者 ——
      #    只要给某人 write，他就有了在同一 PR 里替换扫描器的能力。
      #
      #    同样致命的还有 json/modules.json：changeType 靠它判「首次收录 / 版本更新」，
      #    而「版本更新一律人工审核」正是防「fork 热门模块加几行恶意代码伪装成更新」
      #    的唯一一道防线。索引取自 PR 分支，就等于让投稿人自己声明这是首次收录。
      #
      #    做法是删掉这三棵树再从 base 的 commit 恢复 —— 连 PR 新塞进 audit/ 的
      #    额外文件也一起清掉，而不是只覆盖几个已知路径。
      #    pending/ 保持来自 PR（那才是要审的投稿内容）。
      # ---------------------------------------------------------------
      - name: 把扫描器、合并逻辑与索引钉回 base 版本
        id: pin
        # 只在 PR 上钉 base：这一步要防的是「投稿自带一份扫描器」，而它需要 base_ref 才有对象。
        # workflow_dispatch 是维护者做线上验证的那条路（触发它要 write 权限，投稿者拿不到）：
        # 跑的就是被触发那个 ref 自己那份扫描器，「自带扫描器」这个问题在它身上不存在；
        # zip 由 inputs.zip 直接给，凭据复核那一步同样只挂 PR，所以 dispatch 既不查凭据、
        # 也不读 pending，不会假绿。合并那一步的准入（action == 'auto-approve'）一概不动。
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EXPECTED_BASE: ${{ vars.BASE_BRANCH || 'main' }}
        run: |
          set -euo pipefail

          # 闸门一：base 必须是约定的那条分支。允许 PR 指向任意分支，就等于
          # 允许「以一份没人看的分支为基准」来跑审核。
          if [ "$BASE_REF" != "$EXPECTED_BASE" ]; then
            echo "::error::PR 的 base 是 '$BASE_REF'，而审核只认 '$EXPECTED_BASE'。请改 base 后重开。"
            exit 1
          fi

          git fetch --no-tags --depth=200 origin "$BASE_REF"
          BASE_SHA="$(git rev-parse "origin/$BASE_REF")"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          # 闸门二：把「当前 base」合进工作树，合不动才算问题。
          #
          # 这里原来写的是 `git merge-base --is-ancestor origin/main HEAD`（PR 必须已经
          # 包含当前 main）。它在真实流量上是死结：main 会被机器人自己推进（索引重建 PR
          # 也是合进 main），于是任何一条「提交后才过了几分钟」的投稿 PR 都会变成
          # 「不是 origin/main 的后代」——PR #4 重跑时就死在这句话上，而投稿者是个只能
          # 开单文件 PR 的机器人，它不会 rebase，模块就永远进不了索引。
          #
          # 这道闸真正要防的是「拿一条古老分支当基准，用旧扫描器/旧索引给自己定罪」，
          # 而那个东西已经被上面的钉定 + 下面的复核挡住了：audit/、scripts/、json/ 一律
          # 取自 BASE_SHA。所以这里改成：把当前 base 合进工作树（不提交），
          # 只有真的**合不动**才拒绝 —— 那才是必须让投稿者处理的情况。
          #
          # 2026-10-17 一条对自己人说的话：这一格原来写的是 `... >/dev/null 2>&1`，把 git 的原话
          # 整个吞掉，只剩一句 `PR 分支与当前 origin/main 冲突`。run 39009735993 就死在那句上，
          # 而我事后把两种形状都在本地复现过（head 落后 base 一个提交、以及 PR 的 merge ref 本身）——
          # **两种都合得干净**。所以那条 ::error:: 是一句没有依据的诊断：它把「merge 没成功」
          # 一律念成「内容冲突」，可原因还有十种。闸的行为一个字不动（合不动仍然拒、仍然 exit 1），
          # 这一发改的只有**别替 git 改口**：把它到底说了什么一起打出来。
          #
          # 2026-10-17 同一天第二次咬：给一条**旧 PR 做整条重跑**取新读数时（run 39022231657 的
          # attempt 2），这一格红在 `Committer identity unknown` + `fatal: empty ident name
          # (for <runner@runnervm…>) not allowed`。本地复现（temp 仓库、global/system 配置指到空文件、
          # head 与 base 各前进一个提交）量到的形状：
          #   有身份 → rc=0，一句 "Automatic merge went well; stopped before committing as requested"
          #   无身份 → rc=128，且连 MERGE_HEAD 都不写
          # 也就是说 `--no-commit` 并不省掉 committer 身份 —— 只要这次 merge **需要新建一个合并提交**
          # 就要。日常 PR 不踩，是因为 actions/checkout 取的是 refs/pull/N/merge（GitHub 已经合好了），
          # 这句退化成 "Already up to date"；而重跑一条 base 已前进的旧 PR 才要真合 ——
          # 「重跑旧 PR 拿新读数」正是这条线反复在做的事（今天就三次：#54 接线、#57 观测、#60 换来源）。
          # 修法只给身份，不动闸的语义：`--no-commit` 不写任何提交，所以这是个**占位身份**，
          # 不构成署名 —— 结论、PR 评论、标签仍然全挂在真实的 workflow run 上。
          if ! MERGE_OUT="$(git -c user.name=modules-audit-pin -c user.email=modules-audit-pin@invalid.invalid merge --no-commit --no-ff "$BASE_SHA" 2>&1)"; then
            {
              echo "::error::把当前 origin/$BASE_REF 合进本 PR 没有成功，审核因此没有一个可信的基准。"
              echo "::error::（不替 git 改口 —— 以前这里只留一句「冲突」，而那句可能不是原因。）"
              printf '%s\n' "$MERGE_OUT" | sed 's/^/::error::/'
            } >&2
            git merge --abort 2>/dev/null || true
            exit 1
          fi

          for d in audit scripts json; do
            if git ls-tree -r --name-only "$BASE_SHA" -- "$d" | grep -q .; then
              rm -rf "$d"
              git checkout "$BASE_SHA" -- "$d"
            else
              echo "::warning::base 版本里没有 $d/ 这棵树，跳过钉定。"
            fi
          done

          # 复核：这三棵树此刻必须与 base 完全一致（有出入就是钉定没生效）
          if ! git diff --quiet "$BASE_SHA" -- audit scripts json; then
            echo "::error::钉定后 audit/scripts/json 仍与 base 不一致，审核结论不可信。"
            git diff --stat "$BASE_SHA" -- audit scripts json || true
            exit 1
          fi
          echo "已钉回 base：$BASE_SHA（audit/ scripts/ json/ 与之一致）"

      # ---------------------------------------------------------------
      # 1. 定位投稿：从 PR 新增/修改的 pending/**/*.json 入手
      #
      #    断点 ① 的修复点。Worker 的 PR 只有 pending/<id>/<versionCode>.json，
      #    zip 在 release asset 上，因此：
      #      a. git diff 找新增/修改的 pending JSON（不再找 *.zip）
      #      b. fetch-pending-zip.mjs 读 JSON 里的 zipUrl（或 releaseTag+assetName）
      #         把 zip 下载到 audit-out/zips/
      #      c. 后面 scan.mjs 扫下载下来的 zip
      # ---------------------------------------------------------------
      - name: 定位投稿元数据
        id: locate
        shell: bash
        env:
          MANUAL_ZIP: ${{ inputs.zip }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          FORCE_PREFIX: ${{ vars.MODULE_REPO_PREFIX || '' }}
          FORCE_INDEX: ${{ vars.MODULE_INDEX_PATH || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          BASE="origin/${{ github.base_ref }}"

          mkdir -p audit-out pending-changed

          # 索引仓库前缀：优先 vars 覆盖，否则按目录是否存在自动探测
          PREFIX="$FORCE_PREFIX"
          if [ -z "$PREFIX" ]; then
            if [ -d contrib/repo/pending ]; then PREFIX="contrib/repo"; fi
          fi
          if [ -n "$PREFIX" ]; then
            PENDING_DIR="$PREFIX/pending"
            INDEX_FILE="$PREFIX/json/modules.json"
            SCRIPTS_DIR="$PREFIX/scripts"
          else
            PENDING_DIR="pending"
            INDEX_FILE="json/modules.json"
            SCRIPTS_DIR="scripts"
          fi
          # 扫描器路径同样由 PREFIX 推导，绝不能写死 contrib/audit/scan.mjs：
          #   PREFIX=contrib/repo（monorepo 形态） -> contrib/audit/scan.mjs
          #   PREFIX 为空（索引仓库在根）          -> audit/scan.mjs
          # 两种候选取第一个真实存在的，兼容两种落地形态。
          if [ -n "$PREFIX" ]; then
            SCANNER_CANDIDATES=("contrib/audit/scan.mjs" "audit/scan.mjs")
          else
            SCANNER_CANDIDATES=("audit/scan.mjs" "contrib/audit/scan.mjs")
          fi
          SCANNER=""
          for c in "${SCANNER_CANDIDATES[@]}"; do
            if [ -f "$c" ]; then SCANNER="$c"; break; fi
          done
          if [ -z "$SCANNER" ]; then
            SCANNER="${SCANNER_CANDIDATES[0]}"
            echo "::warning::未找到 scan.mjs（已尝试：${SCANNER_CANDIDATES[*]}），扫描步骤会明确报错。"
          fi
          # AI 安全员的路径与扫描器同一条纪律：由 PREFIX 推导候选、取第一个真实存在的，
          # 绝不在 AI 步里现编路径（monorepo 形态 contrib/audit/…，索引仓库在根时 audit/…）。
          if [ -n "$PREFIX" ]; then
            AI_REVIEW_CANDIDATES=("contrib/audit/ai-review.mjs" "audit/ai-review.mjs")
          else
            AI_REVIEW_CANDIDATES=("audit/ai-review.mjs" "contrib/audit/ai-review.mjs")
          fi
          AI_REVIEW=""
          for c in "${AI_REVIEW_CANDIDATES[@]}"; do
            if [ -f "$c" ]; then AI_REVIEW="$c"; break; fi
          done
          if [ -z "$AI_REVIEW" ]; then
            AI_REVIEW="${AI_REVIEW_CANDIDATES[0]}"
            echo "::warning::未找到 ai-review.mjs（已尝试：${AI_REVIEW_CANDIDATES[*]}）；AI 步会在这一条上明确红，不会静默当成「未启用」。"
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "index_file=$INDEX_FILE" >> "$GITHUB_OUTPUT"
          echo "scanner=$SCANNER" >> "$GITHUB_OUTPUT"
          echo "ai_review=$AI_REVIEW" >> "$GITHUB_OUTPUT"
          echo "索引仓库前缀：'${PREFIX:-<根>}'（pending=$PENDING_DIR, index=$INDEX_FILE, scanner=$SCANNER, ai_review=$AI_REVIEW）"

          if [ -n "$MANUAL_ZIP" ]; then
            # 手动触发：直接给 zip 路径，走老路径
            printf '%s\n' "$MANUAL_ZIP" > zips.txt
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "pending_count=0" >> "$GITHUB_OUTPUT"
            echo "手动指定 zip：$MANUAL_ZIP"
          else
            # a. 找本次 PR 新增/修改的 pending/**/*.json（递归，含 pending/<id>/<vc>.json）
            #    注意：不再用 -- '*.zip'，PR 里没有 zip，只有元数据。
            #    --no-renames 是必需的，不是风格问题：默认行为会把「改名 + 顺手改一个字段」
            #    折叠成 R068，而 --diff-filter=AM 不打印 R —— 于是 pending/demo/1.json 改成
            #    pending/evil/1.json 时这里一条都不输出，found=false，后面的复核整个不跑。
            #    打上 --no-renames 后同一笔改动是「删旧 + 增新」，新路径照常输出。
            #    这条过滤本身仍不是可信边界（大写扩展名 .JSON 连 pathspec 都过不了）：
            #    下面 proof 步会用 git ls-tree 自己再算一遍范围，漏了就把这次跑成红的。
            PENDING=$(git diff --name-only --no-renames --diff-filter=AM "$BASE" HEAD -- "${PENDING_DIR}/**/*.json" || true)
            if [ -z "$PENDING" ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "pending_count=0" >> "$GITHUB_OUTPUT"
              echo "本次 PR 没有新增/修改的 pending 投稿元数据，跳过审核。"
              exit 0
            fi

            # 把变更的 pending 文件原样拷到 pending-changed/pending/ 下（剥离前缀），
            # 这样后续步骤拿到的始终是一个标准的 pending 目录树。
            COUNT=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              REL="${f#"$PENDING_DIR"/}"
              mkdir -p "pending-changed/pending/$(dirname "$REL")"
              cp "$f" "pending-changed/pending/$REL"
              COUNT=$((COUNT+1))
            done <<< "$PENDING"

            echo "本次 PR 涉及 $COUNT 个 pending 元数据："
            printf '%s\n' "$PENDING"
            if [ "$COUNT" -eq 0 ]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "pending_count=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # b. 读元数据里的下载地址 -> 下载 zip 到 audit-out/zips/
            node "$SCRIPTS_DIR/fetch-pending-zip.mjs" \
              pending-changed/pending \
              --out-dir audit-out/zips \
              --owner "$GITHUB_OWNER" --repo "$GITHUB_REPO"

            echo "pending_count=$COUNT" >> "$GITHUB_OUTPUT"

            # c. 用下载产物拼出待扫 zip 列表
            ls -1 audit-out/zips/*.zip > zips.txt 2>/dev/null || true

            # 只要有 pending 却没拿到它对应的包，这次审核就没有结论。必须失败，
            # 不能 ::warning:: 之后 exit 0 —— 「绿勾 + 一个字节都没扫」是这道闸最
            # 危险的形态：它把「让下载失败」变成一种绕过方式。
            # 取包失败在脚本里是按条目记 error、且只要还有一条成功就返回 0，
            # 所以判据必须看 manifest，而不是数文件个数。
            if [ -f audit-out/zips/manifest.json ]; then
              node -e '
                const fs=require("fs");
                const recs=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                const bad=(Array.isArray(recs)?recs:[]).filter(r=>r && (r.error || !r.zip));
                if(!bad.length){ console.log("manifest：全部 "+recs.length+" 条都取到了待审包"); process.exit(0); }
                for(const b of bad) console.log("::error::"+(b.id||"?")+" 未取得待审包："+(b.error||"manifest 里没有 zip 字段"));
                process.exit(1);
              ' audit-out/zips/manifest.json
            fi
            if [ ! -s zips.txt ]; then
              echo "::error::已定位 $COUNT 个 pending 元数据，但一个 zip 都没拿到，审核无结论。"
              exit 1
            fi
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "待审核 zip："
            cat zips.txt
          fi

      # ---------------------------------------------------------------
      # 1a. pending 凭据与来源复核（设计文档 §14.2）
      #
      # 为什么单独立这一步：/submit 的归属闸只挡得住从表单进来的提交，而这个仓库还
      # 公开吃着 hand-written 的 pending/** PR —— locate 的路径白名单认 pending 的
      # 新增/修改，approve 只看扫描结论，此前没有任何一条检查看过 pending JSON 里的
      # pledge/ownership/identity。栽赃一条假条目不碰酷安、不碰 /submit 也能达成。
      #
      # 三道检查各自买到什么（脚本头有全文，这里只留结论）：
      #   (a) 推导复算：pledge.version 在已发布集合内、ownership.via === 'bio'、
      #       ownership.proofPrefix === sha256(entry.id + ':' + <digest>)[0:8]。
      #       离线、无密钥、无网络。挡的是「形状都不对」的伪造；**挡不住**会自己
      #       算哈希的人拼一条自洽的 —— 那条路靠 (b) 封。它复算的是条目里**客户端自己上报**
      #       的 sha256，这个值等于 Worker ⑤-f 绑进口令的那份摘要，只因为 ⑤-c 禁止
      #       claimedSha ≠ computedSha（worker/src/index.ts:2136-2154）；那边放宽，这里就在
      #       验一条 Worker 从没验过的串。
      #   (b) 来源核对：带新增/修改 pending 的 PR 必须由 Worker 的 GitHub App 开出。
      #       actor 值取自事件载荷；允许列表是 repo variable，默认值为 2026-10-12
      #       从线上真 PR 载荷核实的那一个（gh api repos/SukiSU-Community/modules-repo
      #       /pulls/30 --jq .user.login → sukisu-module-submissions[bot]，见 task-13 回报）。
      #   (c) 范围自算：本步**不**把「查哪些文件」交给 locate 的那条 git diff。它自己用
      #       rename-agnostic 的 `git ls-tree -r --name-only` 比 base/head 两棵 pending 树，
      #       算出新增或正文变过的路径（同一手法见 scripts/verify-index-pr.mjs:300-322），
      #       再要求每一条都能在 pending-changed/pending 里找到 —— 少一条就 ::error:: 退出 1。
      #       为什么必须有这一条：`git diff --diff-filter=AM` 怎么分类是**攻击者能选的**
      #       （改名带编辑折叠成 R068 → 一条都不打印；`.JSON` 大写扩展名过不了 case-sensitive
      #       的 pathspec，却被 build-index 的 isPendingJson 照收）。这两种形状过去让
      #       found=false，于是本步压根不跑，approve 按「无待审内容」退出 0，人看到绿勾就合，
      #       publish-from-main.mjs:140-146 再把那个 success 当机器批准盖章进公开索引。
      #
      # 因此这一步的 if 不再挂 locate 的 found（每个 PR 都跑），改由脚本自己判断有没有
      # 可检对象：独立推导为空 → 退出 0（docs/索引重建这类没碰 pending 的 PR 照常走）；
      # 非空却在看不到那些文件的地方 → 红。附带一条：目录里一个元数据都没有也算失败，
      # 「0 个 pending 文件」不是通过 —— 它只可能是选择集坏了。
      #
      # 买不到的两条，说破（旧注释把它写成「只剩内部人」，那是过度声称）：
      #   * 有 main 写权限的内部人 —— 挡它的是 publish-from-main.mjs 人工路的 REQUIRED_SIGNERS=2。
      #   * 【2026-10-17 已关，关在本步之外】曾经有一条谁都能走的路：一个 PR 同时改
      #     json/dispositions.json 与一份「对得上推导」的 json/modules.json，被下面的 kind 步判成
      #     index_pr=true ⇒ verify-index-pr.mjs 的台账驱动分支（:172-179）只看重算结果一致，
      #     对台账 diff 既不看凭据也不看署名（by 是自由文本），merge-index 于是自动合。
      #     本地复现打出四格（加 revoke、加 deny、删 revoke，后两格的索引只是缩进与键序变了）。
      #     现在这条路有两道闸：① kind 步按路径名单独认一次台账改动，台账进过 diff 就不算「索引重建」；
      #     ② derive 步在同一次调用里取处置署名（两名 OWNER/MEMBER 的 #human-approved，且每条新增/改动的
      #     by 回访得到其中一个人的真评论），approve 对动了台账的 PR 要求这一格成立才给绿，
      #     merge-index 只在签齐时才走 ledger 那一支自动合。两道都不在本步，也不由本步负责。
      #     钉子：test/publish-from-main.test.mjs 那批「逐字执行 kind」的用例（含一条变异哨兵证明牙在
      #     `[ -z "$CHANGED_LEDGER" ]` 那一句）、test/verify-index-pr.test.mjs 那批署名用例
      #     （含一对正反形状：一致 + 有签 = 绿，一致 + 没签 = 红）。
      #     本步仍然不覆盖它：本步管的是 pending 的形状与来源，台账这条路今天不经本步、也不经机器路由。
      #
      # 只吃 pending-changed/pending：那是上面 locate 用 `git diff --no-renames --diff-filter=AM`
      # 从 base..head 拷出来的「本 PR 新增/修改」集合，main 上的历史 pending（本轮之前
      # 投稿的、没有这三个字段的）天然不在范围内。接线由 test/verify-pending-proof.test.mjs
      # 钉住（指回整棵 pending/ 会让那条测试红）。
      # 失败 = ::error:: + 非零退出 → audit 作业红 → approve 的「上游没过检」步拒绝批准。
      # 不许 continue-on-error。
      # ---------------------------------------------------------------
      - name: pending 凭据与来源复核（§14.2）
        id: proof
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          REQUIRE_ACTORS: ${{ vars.SUBMISSION_PR_ACTORS || 'sukisu-module-submissions[bot]' }}
          PREFIX: ${{ steps.locate.outputs.prefix }}
          BASE_SHA: ${{ steps.pin.outputs.base_sha }}
        run: |
          set -euo pipefail
          P="${PREFIX:+$PREFIX/}"
          node "${P}scripts/verify-pending-proof.mjs" pending-changed/pending \
            --require-actor "$REQUIRE_ACTORS" --actor "$ACTOR" \
            --scope-base "$BASE_SHA" --scope-head HEAD --scope-dir "${P}pending"

      # ---------------------------------------------------------------
      # 1b. 判定这个 PR 是哪一类：投稿 / 索引重建 / 都不是
      #
      # 为什么要单独立一步而不是塞进 approve：两类 PR 的判据完全不同，混在一个
      # shell 里迟早写成「看起来都过了」。索引 PR 必须由内容判定，不能由
      # 「它没有投稿内容」判定 —— 后者等于给手改索引开门。
      # ---------------------------------------------------------------
      - name: 判定 PR 类型
        id: kind
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          FOUND: ${{ steps.locate.outputs.found }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin "$BASE_REF" >/dev/null 2>&1 || true
          BASE_SHA="$(git rev-parse "origin/$BASE_REF")"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          # ACMR：新增/复制/修改/重命名才算改了索引；删除索引不是重建
          #
          # 只看 json/modules.json，不看整个 json/ —— 这一条是「机器人只合索引内容真的变了、
          # 且变得能对得上推导」的 PR。把台账单独也算成索引改动会开一个洞：
          # 删掉一条处置记录（把某人从黑名单里放出来）既不消费 pending，也不改变当前索引，
          # 于是 expected == actual，模式 B 判「推导一致」→ merge-index 自动合。
          # 削弱处置的决定不该由推导说了算，它是人工判断：留在这儿落到「无投稿内容」分支，绿了也要人合。
          CHANGED_JSON=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'json/modules.json' || true)
          #
          # 上面那句「不看整个 json/」防住的是**只改台账**那一格，2026-10-17 本地复现打出了另外四格
          # （台账加一条 revoke、加一条 deny、删一条 revoke，都配一份索引）—— 洞不在「只看 modules.json」
          # 这句选错了文件，而在**两把尺子不是同一把**：这一步按字节判「索引改没改」，
          # derive 按 normalizeIndex（丢 lastUpdate、模块与版本重排）判「推不推导得出」。
          # 于是「改台账 + 索引只做缩进与键序的 churn」这一格：这一步说是索引重建，derive 说推导一致
          # ⇒ merge-index 自动合。载荷是任何账号都能下任意下架、或封掉一个 UID 的未来所有投稿，
          # 而伪造的 by 会被 Worker 当成「下处置的人」念给投稿者（台账命中不改退出码，署名是自由文本）。
          # ⇒ 台账进过 diff 就不算索引重建，无论索引改没改、改成什么形状（那步 churn 就是为了让这一步看见）。
          # 这里**故意不加 --diff-filter**：把整个 json/dispositions.json 删掉是一次 D，
          # 那正是一整本处置的消失，必须和「改一条」同样拦。
          # 但这条路不是「停在人工」：它换了一道判据 —— derive 去取两名「对这个仓库有 write/admin」的人的 #human-approved，
          # 并逐条把新增/改动的 by 回访成其中一个人的真评论（判据在 verify-index-pr.mjs，
          # 复用 publish-from-main 的 findHumanApprovals / REQUIRED_SIGNERS=2，不另起一套）。
          # 签齐 ⇒ ledger_sealed=true ⇒ merge-index 走 ledger 那一支照旧自动合，
          # 连带把它后面那步 CDN purge 一起跑掉（下架的生效速度由 TTL 决定，不由 main 决定）；
          # 签不齐 ⇒ approve 红。顺序要紧：approve 那句「没有投稿内容 ⇒ 无批准事项」会给一枚绿勾，
          # #53 那条 canary 在线上读到的正是它，所以台账这一支必须排在那句前面。
          CHANGED_LEDGER=$(git diff --name-only "$BASE_SHA" HEAD -- 'json/dispositions.json' || true)
          # 台账这条路单独导出一个 ledger_pr：它不是「索引重建」，但也不是「没有内容要判」——
          # 它是一次人的决定，要有两名有仓库写权限的人签在上面（derive 那一步去取这个证据），签齐了才许自动合。
          echo "ledger_pr=$([ -n "$CHANGED_LEDGER" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ -n "$CHANGED_JSON" ] && [ -z "$CHANGED_LEDGER" ] && [ "${FOUND:-}" != "true" ]; then
            echo "index_pr=true" >> "$GITHUB_OUTPUT"
            echo "这是索引重建 PR（改了 json/modules.json，未动处置台账，且不含新投稿）：$CHANGED_JSON"
          else
            echo "index_pr=false" >> "$GITHUB_OUTPUT"
            if [ -n "$CHANGED_LEDGER" ]; then
              echo "::warning::这个 PR 动了处置台账（$CHANGED_LEDGER）—— 台账上的处置是人工判断：不认领索引重建，改由 derive 那一步逐个查签名人的仓库权限（write/admin 才算；签不齐 approve 直接红，见 GOVERNANCE.md）。"
            elif [ -n "$CHANGED_JSON" ]; then
              echo "::warning::这个 PR 同时带投稿和索引改动 —— 索引改动不会被推导判定放行，投稿按扫描结论走。"
            fi
            echo "不是索引重建 PR（found=${FOUND:-<空>}，索引改动=${CHANGED_JSON:-无}，台账改动=${CHANGED_LEDGER:-无}）"
          fi

      - name: 验索引由 base 推导 + 取处置署名（索引 PR 与台账 PR）
        id: derive
        # 台账 PR 也走这一步：同一次调用既重算索引（内容那一半），也取处置署名（人的那一半）。
        # 分两步写会多一次 git 遍历，更糟的是两份「这个 PR 动了什么」的判断可能漂开。
        if: steps.kind.outputs.index_pr == 'true' || steps.kind.outputs.ledger_pr == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.kind.outputs.base_sha }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORCE_PREFIX: ${{ vars.MODULE_REPO_PREFIX || '' }}
        run: |
          set -euo pipefail
          PREFIX="$FORCE_PREFIX"
          if [ -z "$PREFIX" ] && [ -d contrib/repo/pending ]; then PREFIX="contrib/repo"; fi
          PENDING_DIR="${PREFIX:+$PREFIX/}pending"
          INDEX_FILE="${PREFIX:+$PREFIX/}json/modules.json"
          DISPOSITIONS_FILE="${PREFIX:+$PREFIX/}json/dispositions.json"
          SCRIPTS_DIR="${PREFIX:+$PREFIX/}scripts"
          set +e
          node "$SCRIPTS_DIR/verify-index-pr.mjs" --base "$BASE_SHA" --head HEAD \
            --owner "$OWNER" --repo "$REPO" --pending-dir "$PENDING_DIR" \
            --index-file "$INDEX_FILE" --dispositions-file "$DISPOSITIONS_FILE" \
            --pr "$PR_NUMBER" \
            --report verify-index-pr.report.json
          RC=$?
          set -e
          if [ "$RC" = "0" ]; then
            echo "derived=true" >> "$GITHUB_OUTPUT"
          else
            echo "derived=false" >> "$GITHUB_OUTPUT"
            echo "::error::索引 PR 未通过推导校验，见上面输出。"
          fi
          # sealed 单独导一个 output，且**读的是 report 里那个字段**，不是这一步的退出码：
          # 退出码 0 只说明「索引算得对」，署名那一半没结论时（report.seal 为 null，即这条 PR
          # 没动台账）要写成 false —— 让 approve 那边永远读到一个显式的 false，
          # 而不是一个「没跑成所以大概是 true」的空白。
          node -e '
            const fs = require("fs");
            let sealed = false;
            let why = "读不到 verify-index-pr.report.json";
            try {
              const r = JSON.parse(fs.readFileSync("verify-index-pr.report.json", "utf8"));
              if (r.seal && r.seal.ok) { sealed = true; }
              else if (r.seal) { why = r.seal.reason; }
              else if (r.ledger && r.ledger.changed) { why = "report 里没有 seal 这一格（脚本版本不对？）"; }
              else { why = "这条 PR 没动台账，署名不适用"; }
            } catch (e) { why = "解析 report 失败 - " + e.message; }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "sealed=" + sealed + "\n");
            if (!sealed) console.log("[derive] sealed=false：" + why);
          '

      # ---------------------------------------------------------------
      # 2. 跑静态扫描（纯 Node，无 npm 依赖）
      # ---------------------------------------------------------------
      - name: 运行 scan.mjs
        id: scan
        if: steps.locate.outputs.found == 'true'
        shell: bash
        env:
          # 全部经 env 传入，不做 ${{ }} 文本拼接，避免 PR 内容注入 shell/node
          FORCE_INDEX: ${{ vars.MODULE_INDEX_PATH || '' }}
          LOCATE_INDEX: ${{ steps.locate.outputs.index_file }}
          LOCATE_SCANNER: ${{ steps.locate.outputs.scanner }}
          LOCATE_PREFIX: ${{ steps.locate.outputs.prefix }}
        run: |
          set -euo pipefail
          mkdir -p audit-out
          # 索引用于判定“首次收录 / 版本更新”
          INDEX="${FORCE_INDEX:-$LOCATE_INDEX}"
          [ -f "$INDEX" ] || INDEX=""
          echo "用于判定首次收录/版本更新的索引：${INDEX:-（无，changeType 会退化为 unknown）}"

          # 扫描器路径由 locate 步骤按 PREFIX 推导后传过来（不再写死 contrib/audit/scan.mjs）。
          # 索引仓库形态 PREFIX 为空 -> audit/scan.mjs；monorepo 形态 -> contrib/audit/scan.mjs。
          SCANNER="${LOCATE_SCANNER}"
          if [ -z "$SCANNER" ]; then
            if [ -n "$LOCATE_PREFIX" ]; then
              SCANNER="contrib/audit/scan.mjs"
            else
              SCANNER="audit/scan.mjs"
            fi
            [ -f "$SCANNER" ] || SCANNER="contrib/audit/scan.mjs"
          fi
          if [ ! -f "$SCANNER" ]; then
            echo "::error::找不到扫描器 $SCANNER（PREFIX='${LOCATE_PREFIX:-<根>}'），无法完成安全审核。"
            exit 1
          fi
          echo "扫描器：$SCANNER（PREFIX='${LOCATE_PREFIX:-<根>}'）"

          # 声明的 id / version 取自本次变更的 pending 元数据（递归，Worker 写的是
          # pending/<id>/<versionCode>.json，version 在 versions[].version 里）。
          DECL_ID=""; DECL_VER=""
          PFORM=$(find pending-changed -name '*.json' ! -name '.*' 2>/dev/null | head -n1 || true)
          if [ -n "$PFORM" ] && [ -f "$PFORM" ]; then
            # ⚠️ 原写法 `require(process.argv[1])` 读出空值的真根因（已实测，见回报）：
            #   require() 拿到不带 "./" 前缀的相对路径时，会把它当成**裸模块名**去
            #   node_modules 里解析，而不是当文件路径 —— 于是 MODULE_NOT_FOUND，
            #   错误被 `2>/dev/null || true` 静默吞掉，DECL_ID/DECL_VER 就成了空字符串。
            #   实测：加 "./" 前缀后可 require 成功；换 fs.readFileSync 则相对/绝对路径都稳。
            #
            #   附：node -e 的 process.argv 实测为 [node.exe, arg1, arg2...]，
            #   即 argv[1] 就是第一个实参（不是 node 路径）。但为了不依赖具体约定，
            #   这里统一取**最后一个实参** process.argv[process.argv.length-1]，
            #   无论 argv[1] 还是 argv[2] 是第一个实参都能正确取到文件路径。
            #
            # 结构见 contrib/worker/src/index.ts buildPendingJson（与 PR #1 真实文件一致）：
            #   顶层 id；版本在 versions[versions.length-1].version。
            DECL_ID=$(node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[process.argv.length-1],"utf8"));
              process.stdout.write(String(j.id||j.moduleId||""));
            ' "$PFORM" 2>/dev/null || true)
            DECL_VER=$(node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync(process.argv[process.argv.length-1],"utf8"));
              const v=Array.isArray(j.versions)&&j.versions.length?j.versions[j.versions.length-1]:null;
              process.stdout.write(String((v&&v.version)||j.version||j.versionName||""));
            ' "$PFORM" 2>/dev/null || true)
            echo "投稿声明：id=$DECL_ID version=$DECL_VER（来自 $PFORM）"
            # 供应链红线：id 读不出来就判不了「首次收录 vs 版本更新」，
            # 而规则是版本更新一律人工审 —— 读错会把更新误判成首次收录而自动放行。
            # 所以宁可 fail closed：拿不到 id 就让流水线报错终止，不做无依据的自动放行。
            if [ -z "$DECL_ID" ]; then
              echo "::error::无法从 $PFORM 读出投稿 id，无法判定首次收录/版本更新，终止审核（不做自动放行）。"
              exit 1
            fi
            if [ -z "$DECL_VER" ]; then
              echo "::warning::无法从 $PFORM 读出投稿 version，变更类型判定可能退化为 unknown。"
            fi
          fi

          : > audit-out/summary.md
          # 先把待扫清单打出来：这一步曾经出现过「zips.txt 非空、循环却一次都没跑、
          # 步骤仍然 success」的形态（PR #4 run 38061078816），而下游 分流决策 只留下一句
          # `ls: cannot access 'audit-out/*.audit.json'`。没有清单，那种失败无从判断。
          echo "待扫清单 $(wc -l < zips.txt) 行："; cat zips.txt
          WANT=$(wc -l < zips.txt)
          GOT=0
          while IFS= read -r ZIP; do
            [ -z "$ZIP" ] && continue
            [ -f "$ZIP" ] || { echo "::warning::$ZIP 不存在，跳过"; continue; }
            ARGS=(--out-dir audit-out --index "$INDEX")
            [ -n "$DECL_ID" ] && ARGS+=(--declared-id "$DECL_ID")
            [ -n "$DECL_VER" ] && ARGS+=(--declared-version "$DECL_VER")
            node "$SCANNER" "$ZIP" "${ARGS[@]}" --quiet | tee -a audit-out/summary.md
            GOT=$((GOT+1))
          done < zips.txt

          # 覆盖度闸：清单里每一条都必须产出一份扫描结论。少一条就是「绿勾 + 没扫过的内容」，
          # 那是这道闸最危险的形态 —— 它把「让扫描不产出」变成一种绕过方式。
          # 宁可红着让人来看，也不能让 approve 在没扫过的包上盖章。
          PRODUCED=$(find audit-out -maxdepth 1 -name '*.audit.json' | wc -l)
          if [ "$PRODUCED" -lt "$WANT" ]; then
            echo "::error::待扫清单 $WANT 条，实际只产出 $PRODUCED 份扫描结论（循环跑了 $GOT 次），审核未覆盖全部投稿内容，终止。"
            exit 1
          fi
          echo "覆盖度检查通过：$PRODUCED 份扫描结论覆盖 $WANT 条待扫包"

      # ---------------------------------------------------------------
      # 3. AI 安全员（Task 6.1）—— 五态在这一格写出，红由「分流决策」开火
      # ---------------------------------------------------------------
      - name: AI 安全员复核
        id: ai
        if: steps.locate.outputs.found == 'true'
        shell: bash
        env:
          # 全部经 env 传入，绝不把 ${{ }} 拼进命令文本：PAT 与 agent 配置出现在命令里
          # 就等于把它们写进 runner 的日志与进程列表。
          LOCATE_AI_REVIEW: ${{ steps.locate.outputs.ai_review }}
          LOCATE_PREFIX: ${{ steps.locate.outputs.prefix }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QCA_AGENT_ID: ${{ vars.QCA_AGENT_ID }}
          QCA_AGENT_VERSION: ${{ vars.QCA_AGENT_VERSION }}
          QCA_ENVIRONMENT_ID: ${{ vars.QCA_ENVIRONMENT_ID }}
          QCA_PROMPT_SHA: ${{ vars.QCA_PROMPT_SHA }}
        run: |
          # 本步的规矩是「非 ok 不在这里开火」（工单 §0.2-2）：ai-review.mjs 对任何非 ok（failed /
          # untrusted / over-budget 都算）一律 exit 1，而下面 分流决策 的 if 是 found=='true'、没有
          # always()。本步先红会把 triage 整步跳过：五态文案永远出不来、判据 output 全空、PR 上一片
          # 沉默，而「沉默 + 前一步红」比「判据红」更难查。
          # ⚠️ 但这条规矩**不能靠省略 -e 来兑现**（2026-10-16 run 38904316355 实测）：GitHub 把
          # `shell: bash` 展开成 `bash --noprofile --norc -e -o pipefail`，那个 `-e` 是 runner 给的，
          # 这里写 `set -uo pipefail` 撤不掉它。旧写法（`node …` 接 `CODE=$?`）在线上等于
          # 「第一个非 0 退出码当场把整步打断」——CODE 永远来不及收，收口与 triage 一起没了。
          # 所以规矩落在调用点上：**每个预期会非 0 的调用都必须自带 `|| CODE=$?`**。
          # 本步只有一种情况自己红：这一层**根本没运行**（模块缺失 / 状态文件没写出来 / 配置错误）。
          set -uo pipefail
          mkdir -p audit-out

          # 路径由 locate 的候选探测传进来。万一没传（手工 dispatch、旧 runner），
          # 这里按同一套候选再探一次 —— 两种落地形态都认，不硬编单一答案。
          AI="${LOCATE_AI_REVIEW:-}"
          if [ -z "$AI" ]; then
            if [ -n "${LOCATE_PREFIX:-}" ]; then
              AI_CANDIDATES=("contrib/audit/ai-review.mjs" "audit/ai-review.mjs")
            else
              AI_CANDIDATES=("audit/ai-review.mjs" "contrib/audit/ai-review.mjs")
            fi
            for c in "${AI_CANDIDATES[@]}"; do
              if [ -f "$c" ]; then AI="$c"; break; fi
            done
          fi
          if [ ! -f "${AI:-}" ]; then
            echo "::error::找不到 ai-review.mjs（AI_REVIEW='${AI:-<空>}'，前缀='${LOCATE_PREFIX:-<根>}'）：AI 这一层没接上线，宁可红也不静默退成「未启用」。"
            exit 1
          fi

          # 凭据四件缺任一 ⇒ 这一层未启用：逐包写 disabled，**一次都不调用脚本**。
          # QCA_AGENT_VERSION 也在这一闸里：版本没钉住就发出去 = 把闸的语义交给供应商的默认值，
          # 所以缺它不许退化成 latest。
          CRED_MISSING=""
          for k in QODER_PAT QCA_AGENT_ID QCA_AGENT_VERSION QCA_ENVIRONMENT_ID; do
            [ -n "${!k:-}" ] || CRED_MISSING="$CRED_MISSING $k"
          done
          if [ -n "$CRED_MISSING" ]; then
            echo "AI 安全员未启用（缺：${CRED_MISSING# }）—— 逐包写 disabled，不调用脚本。"
          fi

          # 逐包循环。报告按 zip 名定位：scan.mjs 的默认命名是 `<zip 的 basename>.audit.json`
          # （**含 .zip**），状态与产物一份一包：ai-<zip basename>.status / .json。
          # 两处都不许 last-wins：`ls -t | head -n1` 会把 A 包配上 B 包的报告（评审 F7），
          # 单文件 ai.status 会让后一包覆盖前一包 —— 投两包、把干净那包写在后面，
          # 另一包的 over-budget 就蒸发了。所以「一包包一份状态」是这条闸的覆盖度本身。
          : > audit-out/ai.codes
          COUNT=0
          while IFS= read -r ZIP; do
            [ -z "$ZIP" ] && continue
            BASE=$(basename "$ZIP")
            COUNT=$((COUNT+1))
            STATUS="audit-out/ai-$BASE.status"
            OUT="audit-out/ai-$BASE.json"
            REPORT="audit-out/$BASE.audit.json"
            if [ -n "$CRED_MISSING" ]; then
              printf 'disabled\n' > "$STATUS"
              continue
            fi
            ARGS=(run --report "$REPORT" --zip "$ZIP" --out "$OUT" --status "$STATUS")
            # QCA_PROMPT_SHA 未设 = record-only（脚本把自己算出的 PROMPT_SHA256 记进产物）；
            # 设了就必须与线上 agent 同源，对不上时脚本在写状态之前 exit 2 —— 那是配置错误。
            if [ -n "${QCA_PROMPT_SHA:-}" ]; then
              ARGS+=(--expected-prompt-sha "$QCA_PROMPT_SHA")
            fi
            CODE=0
            # 归零是必须的：`|| CODE=$?` 只在失败那发赋值，不归零会把上一包的退出码当成这一包的。
            # 带 `||` 也是必须的：runner 给的 -e 会在裸 `node` 非 0 时当场打断整步（见本步开头）。
            node "$AI" "${ARGS[@]}" || CODE=$?
            printf '%s %s\n' "$BASE" "$CODE" >> audit-out/ai.codes
            echo "AI 安全员：$BASE → 退出码 $CODE（状态：$( [ -f "$STATUS" ] && tr -d '\r\n' < "$STATUS" || echo '<没写出>' )）"
          done < zips.txt

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::found=true 却拿到 0 条待扫清单：AI 这一步无事可做只能是上面的覆盖闸坏了，宁可红。"
            exit 1
          fi

          # 收口：每一包都要有状态文件，且值 ∈ 五态（over-budget 是 M1 之后脚本会真写的一个，
          # 漏进 case 里就是把合法状态判成非法 —— 红在错的位置、错的原因）。
          BAD=0
          while IFS= read -r ZIP; do
            [ -z "$ZIP" ] && continue
            BASE=$(basename "$ZIP")
            STATUS="audit-out/ai-$BASE.status"
            if [ ! -f "$STATUS" ]; then
              CODE=$(awk -v b="$BASE" '$1==b{print $2}' audit-out/ai.codes)
              if [ "${CODE:-}" = "2" ]; then
                echo "::error::AI 安全员：$BASE 配置错误 —— 退出码 2 是 prompt 分叉（线上 agent 的 system prompt 与本文件不同源）或用法错，状态文件在写之前就没了。这不是模型跑败：去查 QCA_PROMPT_SHA 与那个 agent，别去查供应商。"
              else
                echo "::error::AI 安全员：$BASE 没写出状态文件（退出码 ${CODE:-未记录}）—— 崩溃或 --status 写不出去，这一层的结论根本不存在。"
              fi
              BAD=$((BAD+1))
              continue
            fi
            case "$(tr -d '\r\n' < "$STATUS")" in
              disabled|ok|failed|untrusted|over-budget) ;;
              *)
                echo "::error::AI 安全员：$BASE 的状态不是五态之一（'$(tr -d '\r\n' < "$STATUS")'）。"
                BAD=$((BAD+1))
                ;;
            esac
          done < zips.txt
          if [ "$BAD" -gt 0 ]; then
            exit 1
          fi
          echo "AI 安全员收口通过：$COUNT 包都有状态文件（值 ∈ disabled/ok/failed/untrusted/over-budget）；开火位置在 分流决策。"

      # ---------------------------------------------------------------
      # 4. 定级与分流
      # ---------------------------------------------------------------
      - name: 分流决策
        id: triage
        if: steps.locate.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 多包 PR 取最严（2026-10-13 修；计划 §4 F16）。
          # 这里原本是 `ls -t audit-out/*.audit.json | head -n1` —— 只拿「时间戳最新的那一份报告」定级，
          # 而 publish 作业合的是**整条 PR**。于是一条含两份 pending 的 PR，只要最新那份判成 low+first，
          # 另一份哪怕 high 也会被一起 squash 合并进去；locate 打的 pending_count 从没被任何判据读过。
          # 现在的判据是：auto-approve 只在**每一份**报告都是 low + first 时才成立；
          # 等级取所有报告里最严的那个，module_id / reasons 按包汇总，让人看得出这条 PR 里到底有几个人投稿。
          # 没有报告就不许定级（audit-out 为空 → 直接红），不许把「什么都没扫到」当成放行理由。
          #
          # AI 那一层（Task 6.1）在这一格消费，不在别处：五种状态要在这里产生五种不同的下游后果。
          #   disabled      → 等级不动，文案是「未启用」那句；
          #   ok            → 逐包 raiseLevel 抬级（只升不降），findings 并进 reasons；
          #   failed        → 本步 exit 1，「没跑成」那句；
          #   untrusted     → 本步 exit 1，「判据不可采信」那句（与 failed 不同串）；
          #   over-budget   → 本步 exit 1，「送不全」那句：不是它同意，是没看全。
          # 红开在这里而不是 AI 那一步，是因为那一步先红会把本步整步跳过（found=='true' 没有 always()）：
          # 那样五态文案出不来、判据全空、PR 一片沉默 —— 判据层才是开火的正确位置。
          node -e '
            const fs=require("fs");
            const path=require("node:path");
            const {pathToFileURL}=require("node:url");
            const dir="audit-out";
            const out=process.env.GITHUB_OUTPUT;
            const w=(k,v)=>fs.appendFileSync(out,`${k}=${String(v).replace(/\r?\n/g," ")}\n`);
            const idOf=(r)=> (r.meta && r.meta.id) ? r.meta.id : "(缺失)";
            const verOf=(r)=> (r.meta && r.meta.version) ? r.meta.version : "";
            // changeType 的算法只许有一份：绿那一发与红那一发必须报出同一个值。
            const changeTypeOf=(rs)=>{
              const u=[...new Set(rs.map((x)=>x.r.changeType||"unknown"))];
              return u.length===1 ? u[0] : u.sort().join("+");
            };
            let names=[];
            let reports=[];
            // 判据红的那一发也要先把 output 写完再 exit 1（盘点 G.2；§0.47 留下的那半边）。
            // 原来写 $GITHUB_OUTPUT 的整段在脚本**末尾**，而每一条 fail-closed 都在它之前 process.exit(1)
            // ⇒ 红那一发 steps.triage.outputs.* 全空，下游想解释「红叉为什么」只能拿空值渲染 = 一句假陈述。
            // 写的方向只有一个：fail closed。**红仍然是这一发的结论** —— 退出码一个字没动。
            // risk 故意留空：本轮没有产出等级。填 high 是把我们的故障说成投稿者的风险，
            // 填静态那一档是把「AI 没来得及抬级」说成「已经量过」—— 两句都是假陈述。
            // 下游要区分「没有结论」与「量出来是 X」，靠的是 steps.triage.conclusion，不是这个字段。
            const writeFailClosed=(m,aboutAi)=>{
              w("risk","");
              w("change_type",reports.length ? changeTypeOf(reports) : "");
              w("module_id",[...new Set(reports.map((x)=>idOf(x.r)))].join(","));
              w("module_version",[...new Set(reports.map((x)=>verOf(x.r)))].join(","));
              // 一份报告都没读成时，还能说的只剩「这个 PR 里有几份报告文件」。
              w("package_count",String(reports.length || names.length));
              w("ai_note",aboutAi===false ? "" : m);
              w("reasons",m);
              // 这三格永远不过 decide()：红那一发的处置只有一个方向。而 auto-approve 是 publish 作业的门票
              // （它的 if 认 found 与 action 两个 output）、auto-approved 是标签步会真打上去的颜色 ——
              // 判据自己没跑成却写出这两格里任何一个，就是把「通道坏了」渲染成「已放行」。
              w("action","block"); w("label","needs-human-review"); w("needs_human_review","true");
            };
            const fail=(m,aboutAi)=>{ console.error(`::error::分流决策：${m}`); writeFailClosed(m,aboutAi); process.exit(1); };
            const NO_REPORT="found=true 但 audit-out 里没有任何 .audit.json —— 没有报告就不定级，更不放行";
            (async () => {
            names=fs.readdirSync(dir).filter((f)=>f.endsWith(".audit.json")).sort();
            if (names.length===0) {
              console.error(`::error::${NO_REPORT}`);
              writeFailClosed(NO_REPORT,false);
              process.exit(1);
            }
            const order={low:1,medium:2,high:3};
            // 读不懂的报告不是「低风险」。riskLevel 缺失或不在枚举里时按 high 排 ——
            // 否则排序比较器拿到 undefined 会当成「相等」，一份坏报告就能把整条 PR 顶到 low。
            const riskOf=(x)=>(typeof x.riskLevel === "string" && order[x.riskLevel] !== undefined) ? x.riskLevel : "high";
            reports=names.map((f)=>({
              pkg:f.replace(/\.audit\.json$/,""),
              r:JSON.parse(fs.readFileSync(dir+"/"+f,"utf8")),
            }));
            const pkgs=reports.map((x)=>x.pkg);

            // ---- AI 状态：audit-out/ai-<zip basename>.status，一份一包（§0.2-3 不许 last-wins）
            // <zip basename> 与报告名同源：scan.mjs 写的就是 `<zip name>.audit.json`，含 .zip。
            const FIVE=["disabled","failed","untrusted","over-budget","ok"];
            const statusFiles=fs.readdirSync(dir).filter((f)=>/^ai-.*\.status$/.test(f)).sort();
            const pkgOfStatus=(f)=>f.slice(3,-".status".length);
            const orphan=statusFiles.filter((f)=>!pkgs.includes(pkgOfStatus(f)));
            // 口径钉子：两侧 basename 只要漂一个「.zip」，这里必须红。让它绿的后果是「读不到状态文件
            // → 退成未启用 → AI 层被整个跳过还留着绿勾」，那正是这一层最贵的失效形态。
            if (orphan.length) fail(`ai-*.status 与扫描报告对不上口径：${orphan.join(", ")} 找不到同名的 .audit.json`
              + `（报告清单：${pkgs.join(", ")}）—— 两边的 zip basename 口径漂了，不许当成「未启用」放过去`);
            const ai={};
            for (const f of statusFiles) {
              const v=fs.readFileSync(dir+"/"+f,"utf8").trim();
              if (!FIVE.includes(v)) fail(`${f} 的内容不是五态之一：${JSON.stringify(v)}（只认 ${FIVE.join("/")}）`);
              ai[pkgOfStatus(f)]=v;
            }
            const noStatus=pkgs.filter((p)=>ai[p]===undefined);
            if (statusFiles.length && noStatus.length) fail(`有 ${noStatus.length} 包没有对应的 ai-*.status：${noStatus.join(", ")}`
              + " —— AI 步的收口闸没咬住；「缺状态」不等于「没配凭据」，不许退成未启用");
            // 三种「跑了但不成立」各用自己那句串。合并成一句，下游就只剩一种后果（§0.1）。
            const fire=(list,label,extra)=>{
              if (!list.length) return;
              const detail=list.map((p)=>{
                let a=null; try { a=JSON.parse(fs.readFileSync(`${dir}/ai-${p}.json`,"utf8")); } catch { /* 读不到原因就只报状态，红照旧 */ }
                const why=(a && typeof a.reason === "string") ? `（${a.reason.slice(0,200)}）` : "";
                return `${p}${why}`;
              }).join(" ");
              fail(`AI 安全员${label}（${list.length} 包：${detail}）：${extra}`);
            };
            fire(pkgs.filter((p)=>ai[p]==="failed"),"没跑成",
              "这一发的结论不存在（模型调用失败 / 输入读不到 / 产物写不出去），不许把「没意见」当成「同意」");
            fire(pkgs.filter((p)=>ai[p]==="untrusted"),"判据不可采信",
              "跑成了但 schema 或逐字引用复验不过，整份不采信 —— 要修的是我们的 prompt 与预算，不是供应商");
            fire(pkgs.filter((p)=>ai[p]==="over-budget"),"送不全",
              "不是它同意，是没看全 —— 原文装不进单发预算或压根没有可送入的条目，这一发根本没发过");

            const repByPkg={};
            for (const x of reports) repByPkg[x.pkg]=x.r;
            const okPkgs=pkgs.filter((p)=>ai[p]==="ok");
            const art={};
            const aiLevel={};
            let raiseLevel=null;
            if (okPkgs.length) {
              // 抬级用的实现必须是 base 里那一份（pin 步钉过的那棵树）；判据只许有一份，不在这里抄第二份。
              const cands=["audit/ai-review.mjs","contrib/audit/ai-review.mjs"];
              const hit=cands.find((c)=>fs.existsSync(c));
              if (!hit) fail(`状态里有 ok，但读不到 ai-review.mjs（已尝试：${cands.join(", ")}）：拿不到 raiseLevel 就不许定级`);
              const mod=await import(pathToFileURL(path.resolve(hit)).href);
              if (typeof mod.raiseLevel !== "function") fail(`${hit} 没有导出 raiseLevel：抬级这条判据不在我们 import 的那一份里`);
              raiseLevel=mod.raiseLevel;
              for (const p of okPkgs) {
                const f=`ai-${p}.json`;
                if (!fs.existsSync(dir+"/"+f)) fail(`状态是 ok 但产物读不到：${f} —— 没有产物就没有「逐字复验过」这回事`);
                let a;
                try { a=JSON.parse(fs.readFileSync(dir+"/"+f,"utf8")); } catch (e) { fail(`状态是 ok 但产物解析不了：${f}（${e.message}）`); }
                if (a.status!==ai[p]) fail(`AI 产物与状态文件不一致：${f} 里的 status 是 ${JSON.stringify(a.status)}，状态文件是 ${JSON.stringify(ai[p])}`);
                const want=`${p}.audit.json`;
                if (a.target && a.target.report && path.basename(String(a.target.report))!==want) {
                  fail(`AI 产物指向的是别的包：${f} 里写的报告是 ${a.target.report}，本格对应的却是 ${want}`);
                }
                art[p]=a;
              }
            }
            // 逐包抬级（raiseLevel 只升不降），再进既有的「所有报告取最严」。
            // agree:true 时模型声明的 risk 不参与；findings 恒空时 declaredRisk 是 agree:false 唯一的落点。
            for (const p of okPkgs) {
              const list=(Array.isArray(art[p].findings)?art[p].findings:[]).filter((x)=>x && x.source==="ai");
              aiLevel[p]=raiseLevel(riskOf(repByPkg[p]), list, art[p].agree === false ? art[p].risk : null);
            }
            const risk=reports.map((x)=>(aiLevel[x.pkg]!==undefined ? aiLevel[x.pkg] : riskOf(x.r)))
              .sort((a,b)=>order[b]-order[a])[0];
            const changeType=changeTypeOf(reports);
            let reasons=reports.flatMap((x)=>(x.r.riskReasons||[])
              .map((y)=> reports.length>1 ? `${x.pkg}: ${y}` : y));
            // 输入侧「只送投影」那层防护已被撤销（D5b），所以这两根柱子必须留着：
            // 条数封顶 + 单条长度封顶。那是模型产出的、投稿者能影响的文本进 PR 评论前的最后一道。
            for (const p of okPkgs) {
              const list=(Array.isArray(art[p].findings)?art[p].findings:[]).filter((x)=>x && x.source==="ai");
              reasons=reasons.concat(list.slice(0,10).map((x)=>{
                const one=`AI 复核：${String(x.message==null?"":x.message).slice(0,200)}`;
                return reports.length>1 ? `${p}: ${one}` : one;
              }));
            }
            const disabledPkgs=pkgs.filter((p)=>ai[p]==="disabled");
            // 键名 T6.2 去掉了旧的 llm 前缀，改成 ai_note（写出处与两处消费点一起改；
            // 只改一半的那一发会让「复核方式」那一句永远拿到空串）。**文案本身一个字没动** ——
            // 五态怎么开火是 6.1 的资产，改坏了要靠 6.1 那 31 条红来发现。
            let aiNote;
            if (!statusFiles.length) {
              aiNote="AI 安全员这一步没有产物（audit-out 里没有任何 ai-*.status）：本轮只有静态扫描，等级不由 AI 参与";
            } else if (!okPkgs.length) {
              aiNote="AI 安全员未启用（QCA 四件配置缺一：PAT / agent id / agent version / environment id）：本轮只有静态扫描，等级不由 AI 参与";
            } else {
              const changed=okPkgs.some((p)=>order[aiLevel[p]]>order[riskOf(repByPkg[p])]);
              // 立场与效果是两件事，不能共用一个分支（2026-10-16 CI run 38890758068 实测）：
              // 那一条 canary 的产物是 agree:false + 5 条 high findings，而静态本来就是 high，
              // raiseLevel 抬不动 ⇒ 旧写法落到「同意静态结论」那一句 —— 把模型明确说过的「不同意」
              // 抹成了「同意」。等级未抬是**无从再抬**，不是同意。
              const disagreed=okPkgs.filter((p)=>art[p].agree === false);
              aiNote=changed
                ? `AI 安全员已复核（每条引用都逐字复验过送出去的那一份原文）：不同意静态结论，等级已按更严处理抬到 ${risk}`
                : disagreed.length
                  ? "AI 安全员已复核（每条引用都逐字复验过送出去的那一份原文）：不同意静态结论，但没有提出比静态更严的等级，等级未抬；AI 只能加严、无权放行"
                  : "AI 安全员已复核（每条引用都逐字复验过送出去的那一份原文）：同意静态结论，等级未抬；AI 只能加严、无权放行";
              // 混合形态不可能由脚本产生，但也不许被写成「AI 同意」—— 按「有 N 包没有 AI 意见」呈现。
              if (disabledPkgs.length) aiNote+=`；另有 ${disabledPkgs.length} 包没有 AI 意见（未启用）`;
            }
            w("risk",risk); w("change_type",changeType);
            w("module_id",[...new Set(reports.map((x)=>idOf(x.r)))].join(","));
            w("module_version",[...new Set(reports.map((x)=>verOf(x.r)))].join(","));
            w("package_count",String(reports.length));
            w("ai_note",aiNote);
            w("reasons",reasons.join("；"));

            // 决策矩阵：唯一可自动放行的是「每一份都低风险 + 首次收录」。
            // AI 抬完级之后 action 一律由这里重算 —— 判自动放行全仓只许这一处。
            const decide=(r,ct)=> (r==="low" && ct==="first")
              ? { action:"auto-approve", label:"auto-approved", needs_human_review:"false" }
              : { action: r==="low" ? "request-review" : "block", label:"needs-human-review", needs_human_review:"true" };
            const d=decide(risk,changeType);
            w("action",d.action); w("label",d.label); w("needs_human_review",d.needs_human_review);
            })().catch((e)=>{
              // 判据自己出问题 = 红。兜成「按静态结论继续」等于把这道闸交给故障。
              const m=`分流决策异常：${e && e.message ? e.message : String(e)}`;
              console.error(`::error::${m}`);
              // 异常这一路不算 AI 层的说法（它可能压根没走到 AI 那几格），所以不占 ai_note ——
              // 留空时评论层有它自己那句「分流这一步没写出复核方式」，比在这里编一句准确。
              writeFailClosed(m,false);
              process.exit(1);
            });
          '

      # ---------------------------------------------------------------
      # 4-b. 处置台账核对（三处拦截里的 CI 侧那道；判据在 scripts/dispositions.mjs，
      # 与 build-index 的推导、Worker 的提交入口共用同一份实现，不在此处另写一遍）。
      #
      # 命中时这一步**仍然成功**：它只产结论，红由 approve 判。
      # 让扫描作业因为黑名单而崩掉，会把 report / 标签 / 贴回 PR 的报告一起带走，
      # 投稿者只看到一个红叉而不知道为什么被拒。
      # ---------------------------------------------------------------
      - name: 处置台账核对（下架 / 黑名单）
        id: dispose
        if: steps.locate.outputs.found == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.pin.outputs.base_sha }}
          PREFIX: ${{ steps.locate.outputs.prefix }}
        run: |
          set -euo pipefail
          P="${PREFIX:+$PREFIX/}"
          node "${P}scripts/disposition-check.mjs" --github-output \
            --base "$BASE_SHA" \
            --ledger "${P}json/dispositions.json" \
            --pending-dir "${P}pending"

      # ---------------------------------------------------------------
      # 5. 把报告贴到 PR
      # ---------------------------------------------------------------
      # 这一格与下面**评论、标签两格**是判据红之后仍要跑的三步，都挂 `!cancelled()`。
      # 动机是 run 38908245528 实测到的形状：分流决策按设计判红之后，`上传报告` 与后面三步全 `skipped`，
      # 于是最该留证据的那一发（整份 `audit-out/`：扫描报告 + AI 五态产物）只活在会过期的 runner 日志里，
      # 而投稿者屏幕上只有一个红叉。
      # 这里放宽的是**呈现位与证据位**：artifact 是原样落盘的字节，评论是给人读的文本，标签是队列里的颜色 ——
      # 三样都不参与批准，`approve` 读的是 job outputs 而不是这三步，`publish` 只认 `auto-approve`。
      # 评论与标签两步能跟着加，是欠的三件事补齐了（2026-10-17，两条 run 实测）：
      #   ① 「分流整步被跳过」那一发由 run 39007438609 量到（`proof` 先红 ⇒ 11 格 output 天然全空），
      #      所以「有没有结论」**只读 steps.triage.conclusion**，不许读 `risk` 空不空 —— 两种空长得一样、
      #      意思相反：failure 有 fail-closed 写齐的字面量处置，''(skipped) 什么都没人写过；
      #   ② intro 现在按那三种结论分叉，「本轮没有结论」那一支不念等级、不念处置，并点名先红的是哪一步；
      #   ③ 依据条数、模块 id 个数、复核方式长度都过了 seal（≤10 条 / 单条 ≤200），
      #      藏了多少要点名 —— 静默变短等于让人以为没人说过话。
      # 标签那格另有一条：LABEL 为空时直接 return，不许拿空串去 addLabels（那是 API 报错，
      # 会把「通道自己坏了」伪装成「打标签这一步挂了」）。
      # 判据位（scan / ai / 分流 / 处置台账 / 上传待合并 pending）仍然不放宽，分法不变。
      - name: 上传报告
        if: ${{ !cancelled() && steps.locate.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: module-audit-report
          path: audit-out/

      # publish job 需要拿到本次变更的 pending 元数据才能调 build-index.mjs 合并，
      # 因此把它一并存成 artifact（两个 job 之间只有 artifact 是可靠的传递通道）。
      - name: 上传待合并 pending
        if: steps.locate.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pending-to-publish
          path: pending-changed/pending/
          if-no-files-found: warn

      # 只有 PR 事件有 PR 可评论：手动触发那一条路上 context.issue.number 解析成 0，
      # createComment 直接 404（2026-10-16 run 38890758068 实测），整条作业因通道而红，
      # 读不出「这批包过没过检」。不跑，而不是跑了再炸。
      - name: 发布 PR 评论
        if: github.event_name == 'pull_request' && !cancelled() && steps.locate.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          TRIAGE_CONCLUSION: ${{ steps.triage.conclusion }}
          PROOF_CONCLUSION: ${{ steps.proof.conclusion }}
          SCAN_CONCLUSION: ${{ steps.scan.conclusion }}
          AI_CONCLUSION: ${{ steps.ai.conclusion }}
          DISPOSE_CONCLUSION: ${{ steps.dispose.conclusion }}
          DISPOSITION: ${{ steps.dispose.outputs.hit }}
          DISPOSITION_REASON: ${{ steps.dispose.outputs.why }}
          RISK: ${{ steps.triage.outputs.risk }}
          ACTION: ${{ steps.triage.outputs.action }}
          LABEL: ${{ steps.triage.outputs.label }}
          CHANGE_TYPE: ${{ steps.triage.outputs.change_type }}
          AI_NOTE: ${{ steps.triage.outputs.ai_note }}
          MODULE_ID: ${{ steps.triage.outputs.module_id }}
          PACKAGE_COUNT: ${{ steps.triage.outputs.package_count }}
          REASONS: ${{ steps.triage.outputs.reasons }}
        with:
          script: |
            const fs = require('fs');
            const dir = 'audit-out';
            const FENCE = '`'.repeat(3);
            const namesOf = (suffix) => (fs.existsSync(dir)
              ? fs.readdirSync(dir).filter((f) => f.endsWith(suffix)).sort()
              : []);
            const stem = (f, suffix) => f.slice(0, f.length - suffix.length);

            // 逐包（Task 6.2）：这一步原本只贴排序后的第一份 .audit.md，多包 PR 里另外几份
            // 只在文案里被承认「存在于 artifact」。工单 §0 那条验收要的是：陌生人只读这条评论
            // 就能回答「AI 这一层跑没跑 / 它对哪几包说了什么 / 它实际被喂进去多少东西」——
            // 少贴一包，第二问就答不上。包清单 = 静态报告与 AI 产物的并集，两份都要有块。
            const mdPkgs = namesOf('.audit.md').map((f) => stem(f, '.audit.md'));
            // 产物名 = ai-<zip basename>.json（AI 步写死的口径，含 .zip）。剥壳要用「去尾缀 + 去前缀」，
            // 不能拿 stem(f,'ai-') 那种「砍最后三个字符」的写法顶替：它把 'ai-demo.zip' 切成 'ai-demo.'，
            // 于是凭空多出一包、真正的包反而没块 —— 与 6.1 那两条 basename 钉子是同一个病。
            const aiPkgs = namesOf('.json')
              .filter((f) => /^ai-.*\.json$/.test(f))
              .map((f) => stem(f, '.json').slice('ai-'.length));
            const pkgs = [...new Set(mdPkgs.concat(aiPkgs))].sort();

            // 变更类型现在是「本 PR 内所有报告的并集」（会出现 first+update 这种值），
            // 所以标签要做映射：把判据的内部拼法原样贴给投稿者看，等于让他读我们的变量名。
            const CT = { first: '首次收录', update: '版本更新', unknown: '未知' };
            const ctLabel = (s) => String(s || '').split('+').map((x) => CT[x] || x).join('＋') || '未知';
            const COUNT = Number(process.env.PACKAGE_COUNT || 1);

            // ---- 三件封顶（§2 Step 1）：每块一个上限，整条正文一个总上限。
            // GitHub 评论的硬上限是 65536 字符，超了 createComment 直接被 API 拒 —— 那是
            // 「整条 PR 上一片沉默」，比贴不全更糟。60000 是留了 5536 余量的读数。
            const MD_MAX = 12000;
            // AI 块的上限要**大于「装满白名单」的那一发**（10 条 findings × 200 + 10 条 omitted × 200
            // 实测约 9.5K），否则正常的大产物也会被切成半截 JSON —— 那一刀该落在超长自由文本上，
            // 不该落在可核验的读数上。
            const AI_MAX = 12000;
            const BODY_MAX = 60000;
            const RESERVE = 700; // 给「这些包没贴出来」那一句留位置，别让那句自己把上限顶穿
            const TRUNC = '…（本节已截断，完整报告见 workflow artifact：module-audit-report）';

            // ---- 封口：条数 ≤10、单条 ≤200。抄 分流决策 里那句 slice(0,10) + slice(0,200)，
            // 不在这里发明第二份口径 —— 那是「模型产出的、投稿者能影响的文本进 PR 评论前的
            // 最后一道」的评论层另一半。控制序列一并洗掉：白名单里的串也可能是投稿者起的条目名。
            const CAP_ITEMS = 10;
            const CAP_TEXT = 200;
            const seal = (v) => (v === null || v === undefined ? ''
              : String(v).replace(/[\u0000-\u001f\u007f]/g, ' ')).slice(0, CAP_TEXT);
            const numOf = (v) => (typeof v === 'number' && Number.isFinite(v) ? v : null);
            const boolOf = (v) => (typeof v === 'boolean' ? v : null);
            const strOf = (v) => (v === null || v === undefined || v === '' ? null : seal(v));

            // 上面那把 seal 只管白名单里的串；**intro 那几行是原样插值的**，而 REASONS 与
            // MODULE_ID 都不是我们自己造的串（trimSnippet 只压空白、不转义 `<`，module.prop 的
            // id 由投稿者写）。不中和的话，一句 `</details>` 就能提前关掉别人的折叠块、
            // 再开一个自己的 —— 而这条评论是渲染给人看的判据现场。
            // 只做中和（& 先转，避免二次转义），**不删字**：删了没人知道投稿者写过什么。
            const inert = (v) => String(v === null || v === undefined ? '' : v)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;').replace(/>/g, '&gt;')
              .replace(/`/g, '&#96;')
              .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, ' ');

            // ---- 字段白名单（工单 §2 Step 1 点名的那一份；这是白名单，不是黑名单）。
            // 禁止 `JSON.stringify(artifact)` 整包贴：产物里的 reason / problem.raw /
            // problem.bad[].quote / findings[].message 都是「模型转述过的、投稿者能影响的文本」，
            // 原样进 PR 评论 = 二次注入。上游 ai-review 侧 sanitize 过这件事，评论层不许依赖它 ——
            // 判据只许有一份，但**封口**不许只有一层。
            const pickFinding = (x) => ({
              ruleId: seal(x && x.ruleId),
              severity: seal(x && x.severity),
              file: seal(x && x.file),
              line: numOf(x && x.line),
            });
            const SHAPE_KEYS = ['textEntries', 'binaryDigestEntries', 'polyglotAsText',
              'nonTextRerouted', 'forensicsRowsSent'];
            const pickBrief = (b) => (b && typeof b === 'object' ? {
              byteSize: numOf(b.byteSize),
              neededBytes: numOf(b.neededBytes),
              corpusFiles: numOf(b.corpusFiles),
              fileCount: numOf(b.fileCount),
              overBudget: boolOf(b.overBudget),
              budgetBasis: strOf(b.budgetBasis),
              omitted: (Array.isArray(b.omitted) ? b.omitted : []).slice(0, CAP_ITEMS)
                .map((o) => ({ name: seal(o && o.name), bytes: numOf(o && o.bytes), reason: seal(o && o.reason) })),
              shapes: SHAPE_KEYS.reduce((acc, k) => { acc[k] = numOf(b.shapes && b.shapes[k]); return acc; }, {}),
              sections: (Array.isArray(b.sections) ? b.sections : []).slice(0, CAP_ITEMS).map(numOf),
            } : null);
            const pickMeta = (m) => {
              // 「有什么记什么」的那一格：只留标量，串一样过封口（sessionId/eventId 是服务端给的）。
              if (!m || typeof m !== 'object' || Array.isArray(m)) return null;
              const out = {};
              for (const [k, v] of Object.entries(m)) {
                if (typeof v === 'number' || typeof v === 'boolean' || v === null) out[seal(k)] = v;
                else if (typeof v === 'string') out[seal(k)] = seal(v);
              }
              return out;
            };
            const pickAi = (a) => ({
              status: seal(a.status),
              reasonCode: strOf(a.reasonCode),
              staticRiskLevel: strOf(a.staticRiskLevel),
              levelAfterAi: strOf(a.levelAfterAi),
              agree: boolOf(a.agree),
              risk: strOf(a.risk),
              backend: strOf(a.backend),
              model: strOf(a.model),
              promptSha256: strOf(a.promptSha256),
              // 顶层这一格的**真位置在 `brief.budgetBasis`**（`ai-review.mjs` 只把它写进 briefMeta），
              // 旧写法 `strOf(a.budgetBasis)` 永远拿到 null —— 键集用例只钉「键在不在」，钉不出「键有没有值」。
              // 顶层优先、缺则回落到 brief：**键一个不增减**（「缺的写成 null 而不是消失」这条契约留着）。
              budgetBasis: strOf(a.budgetBasis == null ? (a.brief || {}).budgetBasis : a.budgetBasis),
              findings: (Array.isArray(a.findings) ? a.findings : []).slice(0, CAP_ITEMS).map(pickFinding),
              brief: pickBrief(a.brief),
              meta: pickMeta(a.meta),
            });

            const FIVE = ['disabled', 'ok', 'failed', 'untrusted', 'over-budget'];
            const statusOf = (p) => {
              const f = `${dir}/ai-${p}.status`;
              if (!fs.existsSync(f)) return null;
              const v = seal(fs.readFileSync(f, 'utf8').trim());
              return FIVE.includes(v) ? v : '未知状态值（原文不贴）';
            };

            function mdBlock(p) {
              const head = `<details><summary>静态报告 · ${p}</summary>\n\n`;
              const f = `${p}.audit.md`;
              if (!fs.existsSync(`${dir}/${f}`)) {
                return `${head}（这一包没有 ${f}：只有 AI 产物，静态报告读不到）\n\n</details>\n`;
              }
              const md = fs.readFileSync(`${dir}/${f}`, 'utf8');
              const over = md.length > MD_MAX;
              return `${head}${over ? md.slice(0, MD_MAX) : md}\n${over ? `\n${TRUNC}\n` : ''}</details>\n`;
            }

            function aiBlock(p) {
              const head = `<details><summary>AI 安全员 · ${p}</summary>\n\n`;
              const artFile = `ai-${p}.json`;
              const st = statusOf(p);
              if (!fs.existsSync(`${dir}/${artFile}`)) {
                // 没有产物也要有一句话说清「为什么没有」—— 留白会被读成「AI 看了但没意见」。
                const why = st === null ? '没有 ai-*.status：AI 安全员这一步没有产物'
                  : st === 'disabled' ? '状态 disabled（QCA 四件配置缺一，未启用）'
                    : `状态 ${st}：这一发没有写出产物 JSON`;
                return `${head}本轮没有 AI 产物 —— ${why}。\n\n</details>\n`;
              }
              let a = null;
              try {
                const raw = JSON.parse(fs.readFileSync(`${dir}/${artFile}`, 'utf8'));
                if (raw && typeof raw === 'object' && !Array.isArray(raw)) a = raw;
              } catch { a = null; }
              if (!a) {
                // 解析错误的原文不回显：那里面就是投稿者可控的字节。
                return `${head}本轮没有 AI 产物 —— ${artFile} 读不出来（JSON 解析失败，原文不贴）。\n\n</details>\n`;
              }
              const json = JSON.stringify(pickAi(a), null, 2);
              const over = json.length > AI_MAX;
              return `${head}${FENCE}json\n${over ? json.slice(0, AI_MAX) : json}\n${FENCE}\n`
                + `${over ? `\n${TRUNC}\n` : ''}</details>\n`;
            }

            // ---- 本轮「有没有结论」由 steps.triage.conclusion 说，不由 risk 空不空说。
            // 两种空长得一样但意思相反（2026-10-17 两条 run 实测）：
            //   failure = 分流跑了、判不动，自己红的 —— 那一发有 #48 写齐的 11 格 fail-closed 判据可读；
            //   ''(skipped) = 分流整步没运行 —— 没有任何一格被人写过，此时贴「风险等级：（空）」
            //   或替它念一句「⛔ 中/高风险」都是在替一个我们没量过的等级说话。
            const TRIAGE = String(process.env.TRIAGE_CONCLUSION || '');
            const STEP_NAMES = [
              ['验 pending 凭据与来源复核', 'PROOF_CONCLUSION'],
              ['运行 scan.mjs', 'SCAN_CONCLUSION'],
              ['AI 安全员复核', 'AI_CONCLUSION'],
              ['处置台账核对（下架 / 黑名单）', 'DISPOSE_CONCLUSION'],
            ];
            const brokenStep = STEP_NAMES.find(([, k]) => {
              const v = String(process.env[k] || '');
              return v !== '' && v !== 'success';
            });

            // 条数与单条长度这两根柱子原来只量绿那一发；fail-closed 的 reasons 是我们自己的
            // 异常文本，包数与条数都没有上限（盘点 G.2 前提 ③）。沿用上面那把 seal，不在这里
            // 发明第二个口径，只补「藏了几条要点名」——静默变短等于让人以为没人说过话。
            const capItems = (s, sep) => {
              const all = String(s === null || s === undefined ? '' : s).split(sep)
                .map((x) => seal(x)).filter((x) => x !== '');
              const kept = all.slice(0, CAP_ITEMS);
              return { text: kept.join(sep), hidden: all.length - kept.length };
            };
            const capOne = (s) => {
              const raw = String(s === null || s === undefined ? '' : s);
              const one = seal(raw);
              return { text: one, hidden: raw.length > one.length ? raw.length - one.length : 0 };
            };
            const moreNote = (n, what) => (n > 0 ? `…（另有 ${n} ${what}未列出，完整见 artifact：module-audit-report）` : '');

            const idsCap = capItems(process.env.MODULE_ID, ',');
            const reasonsCap = capItems(process.env.REASONS, '；');
            const aiNoteCap = capOne(process.env.AI_NOTE || '（分流这一步没写出复核方式：AI 那一层没有可呈现的文案）');

            const head = `- 本 PR 内投稿数：**${COUNT}**\n`
              + `- 模块 id：\`${inert(idsCap.text)}\`${moreNote(idsCap.hidden, '个')}\n`;
            const verdict = (risk, riskNote, changeType) => head
              + `- 风险等级：**${risk}**${riskNote}\n`
              + `- 变更类型：**${changeType}**\n`
              + `- 处置：**\`${process.env.ACTION}\`** / 标签 \`${process.env.LABEL}\`\n`
              + `- 依据：${inert(reasonsCap.text)}${moreNote(reasonsCap.hidden, '条')}\n`
              + `- 复核方式：${inert(aiNoteCap.text)}${moreNote(aiNoteCap.hidden, '字')}\n`;

            let intro = '## 模块投稿安全审核\n\n';
            const disReason = capOne(process.env.DISPOSITION_REASON);
            if (TRIAGE === 'success') {
              intro += verdict(String(process.env.RISK).toUpperCase(),
                '（取本 PR 全部报告里最严的一份）', ctLabel(process.env.CHANGE_TYPE));
              if (process.env.ACTION !== 'auto-approve') {
                if (process.env.RISK === 'low') {
                  // 走到这一支只有两种可能：含已收录模块的更新，或多份投稿里不全是首次收录。
                  // 两种都不是「中/高风险」——把它写成中/高风险就是把我们的判据说反。
                  intro += `\n⚠️ 风险虽低，但按规则不自动合入（含已收录模块的版本更新，或本 PR 内并非每份投稿都是首次收录）：转人工审核。\n`;
                } else {
                  intro += `\n⛔ 中/高风险，需人工审核后才可进入正式索引；本 PR 不会自动合入。\n`;
                }
              } else if (process.env.DISPOSITION === 'clear') {
                intro += `\n✅ 静态扫描未发现风险且每份投稿都是首次收录，已自动合入索引。\n`;
              } else if (process.env.DISPOSITION === 'hit') {
                // 「命中」不改退出码（disposition-check.mjs:132-135 那条设计：红会把报告与标签一起带走），
                // 所以这一发的 audit 作业是绿的、分流写的确实是 auto-approve，红的是 approve（audit.yml 的
                // DISPOSITION = hit 那一格）。不写这一支，评论就会对着一条被台账拦下的投稿念「已自动合入」。
                intro += `\n⛔ 分流给出的是 auto-approve，但**处置台账命中**（下架或黑名单）：本 PR 不会合入。\n`
                  + `- 台账说：${inert(disReason.text)}${moreNote(disReason.hidden, '字')}\n`;
              } else {
                // 既不是 clear 也不是 hit = 台账那一格没给出结论（读不懂时它 exit 3，output 就是空的）。
                intro += `\n🛑 分流给出的是 auto-approve，但处置台账那一格**没有结论**（这一步没跑完或台账读不懂）：这里不声称已合入 —— 合不合由 approve 判，不由这句判。\n`;
              }
            } else if (TRIAGE === 'failure') {
              // 分流跑了但判不动、自己红的 —— 处置与标签是 #48 写死的字面量，等级**故意**是空的。
              intro += verdict('（本轮没有等级：分流自己没过检）',
                ' —— 这一格空着是判据，不是漏填', ctLabel(process.env.CHANGE_TYPE));
              intro += '\n🛑 上面那个处置是**故障安全方向**（不放行），不是对这一个模块量出来的结论。风险等级填任何一档都是替一个没量过的等级说话；这条通道自己坏了，需要维护者看这条 run。\n';
            } else {
              intro += `- 本轮**没有判据**：分流决策这一步没有运行${brokenStep ? `（先红的是「${brokenStep[0]}」）` : ''}。\n`
                + '- 因此这一条评论里没有任何风险等级、处置或标签结论 —— 不是「低风险」，也不是「不通过」，是没量。\n';
              intro += '\n🛑 审核通道在出结论之前中止了。这不说明你的模块有没有风险，只说明我们这一侧没跑完；请维护者看这条 run 的日志。这条 PR 不会被自动合入。\n';
            }

            let body;
            if (!pkgs.length) {
              body = `${intro}\n⚠️ audit-out 里没有任何 .audit.md 与 ai-*.json：本轮没有可贴出的报告。\n`;
            } else {
              const lead = `\n### 逐包呈现（${pkgs.length} 包：每包一块静态报告 + 一块 AI 安全员产物）\n\n`;
              const fitted = [];
              let used = intro.length + lead.length;
              const hidden = [];
              for (const p of pkgs) {
                const text = `${mdBlock(p)}${aiBlock(p)}\n`;
                // 装不下就整块撤下并点名：半截的 <details> 会把后面的渲染一起带歪，
                // 而静默变短等于让人以为「静态与 AI 对这一包没话说」。
                if (used + text.length <= BODY_MAX - RESERVE) { fitted.push(text); used += text.length; } else hidden.push(p);
              }
              body = intro + lead + fitted.join('');
              if (hidden.length) {
                body += `\n⚠️ 评论总长上限 ${BODY_MAX} 字符（GitHub 是 65536）已满：未贴出的投稿 ${hidden.join('、')}`
                  + ' —— 整块撤下而不是切一半，完整报告见 workflow artifact：module-audit-report。\n';
                body = body.slice(0, BODY_MAX); // 点名那一句自己也受总上限管（包名极多时的兜底）
              }
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # ---------------------------------------------------------------
      # 6. 打标签
      # ---------------------------------------------------------------
      # 与上面那一步同一条理由：addLabels 用的也是 PR/issue 编号，dispatch 上没有对象。
      - name: 打标签
        if: github.event_name == 'pull_request' && !cancelled() && steps.locate.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          LABEL: ${{ steps.triage.outputs.label }}
        with:
          script: |
            // LABEL 为空只有一种意思：分流决策整步没运行（跑了但判不动的那一发写的是 needs-human-review）。
            // 这时候**一个标签都不许打**：拿空串去 addLabels 不是留白，是 API 报错，
            // 而那个报错会把「我们这条通道自己坏了」伪装成「打标签这一步挂了」。
            // 「需要有人看」这件事已经由评论里那句「先红的是哪一步」承担了，不在这里发明第二个信号。
            const label = String(process.env.LABEL || '').trim();
            if (!label) {
              console.log('分流决策没有产出标签（整步未运行）：本轮不打标签，也不建标签');
              return;
            }
            const add = [label];
            if (label === 'needs-human-review') add.push('blocked-auto-merge');
            // 标签可能尚未在仓库中创建，缺失时先建后打
            for (const l of add) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: l });
              } catch {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: l, color: l === 'auto-approved' ? '0e8a16' : 'd93f0b',
                  description: l === 'auto-approved' ? '静态扫描低风险且为首次收录，自动放行' : '需人工审核',
                });
              }
            }
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: add,
            });

  # -------------------------------------------------------------------
  # 判定器自己先过检：跑仓库单测。
  #
  # 为什么挂在这儿而不是只当个信息位：本轮抓到的每一个洞（scan.mjs 的 CLI 入口在 Linux 上
  # 静默不执行、`steps.build` 指向一个没声明的 id、tree 删除项缺 mode、`[skip ci]` 放错位置）
  # 全都是「测试全绿但线上是死的」，而反过来 —— 测试从来没在 CI 里跑过 —— 意味着这些洞连
  # 绿灯都没有过，是纯本地的安慰。判定投稿能不能进 main 的那套代码自己没过检，就不该由它
  # 来批准任何投稿。
  #
  # 于是 approve `needs: selftest` 且 `if: always()`：selftest 不 success 时 approve **自己判红**。
  # 不能靠 needs 把它 skip —— canary PR #24 实测：selftest 红、approve 被 skip，而 GitHub 报
  # `mergeable: MERGEABLE` + `mergeStateStatus: UNSTABLE`，`gh pr merge` 就把那条打坏了测试的 PR
  # 合进了 main。**「required check 从没上报过」（Expected，会 BLOCKED）与「上报了但 skipped」
  # （按满足处理）不是一回事**，后者能让整条保护形同虚设。
  # 接受的语义：**任意一条单测失败都会挡住合并**，包括与本次改动无关的失败。取舍理由是本仓库的
  # 测试只用 node 内置模块、不联网、自建临时 git 仓库；真出现 flaky 应该修测试，而不是把这道闸
  # 拆掉 —— 拆的诱惑很大，因为每次红的都是别人的投稿。
  # -------------------------------------------------------------------
  selftest:
    name: selftest
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 audit 作业同一个大版本：这里跑的就是 audit 作业将要执行的那些脚本。
          node-version: '20'
      - name: 跑仓库单测（test/ 与 audit/ 下的 *.test.mjs）
        shell: bash
        run: node --test

  # -------------------------------------------------------------------
  # 批准闸：把「扫完了」和「可以合并」拆成两个 check。
  #
  # 为什么必须拆：audit job 绿只说明扫描跑通了，不代表结论是放行。required status
  # check 若直接钉在 audit 上，那么「中风险、需人工审核」的 PR 同样能满足 required
  # check —— 分支保护就形同虚设。所以保护要要求的是 approve 这一条，而它只在
  # action == auto-approve 时成功。
  #
  # 这个 job 的 name 是三处约定唯一的连接点：本文件、contrib/audit 模板、
  # scripts/publish-from-main.mjs 里的 APPROVE_CHECK_NAME。改 job 名等于把闸门拆掉，
  # 而 test/publish-from-main.test.mjs 钉住了这条字符串。
  # -------------------------------------------------------------------
  approve:
    name: approve
    # `if: always()` 不是保险丝式写法，是被一条实测打脸后加的：canary PR #24 里 selftest 红，
    # approve 因为 needs 没满足而被 **skip**，结果 GitHub 报 `mergeStateStatus: UNSTABLE` +
    # `mergeable: MERGEABLE`，`gh pr merge` 直接把它合进了 main ——
    # **「required check 没跑过」和「required check 被 skip」不是一回事**：前者是 Expected 会
    # BLOCKED（本文上面修 paths 过滤那次就是撞在这上面），后者按满足处理。所以「上游红了就
    # 让 approve 不跑」等于把闸门拆了还自以为关着。
    #
    # 现在 approve 永远跑，并且第一步先把「上游有没有全部成功」当成自己的判据：任何一环不是
    # success（红、跳过、取消）都直接 exit 1，让 required check 明确变红。
    needs: [audit, selftest]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 上游没过检就没有批准资格（fail closed）
        shell: bash
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          SELFTEST_RESULT: ${{ needs.selftest.result }}
        run: |
          set -euo pipefail
          if [ "${AUDIT_RESULT:-}" != "success" ] || [ "${SELFTEST_RESULT:-}" != "success" ]; then
            echo "::error::拒绝批准：audit=${AUDIT_RESULT:-<空>} selftest=${SELFTEST_RESULT:-<空>}，两者都必须是 success。"
            echo "::error::判定器自己没过检（或扫描本身没跑成）时，这条链没有任何批准结论 —— 这里必须是红，"
            echo "  不能是「跳过」。跳过在 GitHub 眼里等于满足 required check。"
            exit 1
          fi
          echo "上游都过了：audit=success selftest=success，继续按内容与推导判定。"

      - name: 只批准「低风险 + 首次收录」或「可复算的索引重建」或「两名有写权限的人签过的台账改动」
        shell: bash
        env:
          FOUND: ${{ needs.audit.outputs.found }}
          INDEX_PR: ${{ needs.audit.outputs.index_pr }}
          DERIVED: ${{ needs.audit.outputs.index_derived }}
          LEDGER_PR: ${{ needs.audit.outputs.ledger_pr }}
          LEDGER_SEALED: ${{ needs.audit.outputs.ledger_sealed }}
          ACTION: ${{ needs.audit.outputs.action }}
          LABEL: ${{ needs.audit.outputs.label }}
          RISK: ${{ needs.audit.outputs.risk }}
          CHANGE_TYPE: ${{ needs.audit.outputs.change_type }}
          MODULE_ID: ${{ needs.audit.outputs.module_id }}
          REASONS: ${{ needs.audit.outputs.reasons }}
          DISPOSITION: ${{ needs.audit.outputs.disposition }}
          DISPOSITION_REASON: ${{ needs.audit.outputs.disposition_reason }}
        run: |
          set -euo pipefail
          # 台账命中排在所有分支之前：它是「已经判过、结论是不要这条」，
          # 不该因为后面某条分支更宽松就被放过去（索引 PR 也在此列 —— 一条混合了
          # 新投稿的索引 PR 如果命中黑名单，同样必须红）。
          if [ "${DISPOSITION:-}" = "hit" ]; then
            echo "::error::拒绝批准：这条投稿命中处置台账（已下架的内容或已拉黑的主体）。"
            echo "::error::依据：${DISPOSITION_REASON:-（无）}"
            echo "::error::要复核或申诉，去仓库里查 json/dispositions.json 对应那一条的 by 与 at —— 结论上有署名，就能找到下处置的人。"
            exit 1
          fi
          # 索引重建 PR 单独判，且必须排在「没有投稿内容」之前：
          # 它的 found 天然不是 true，若先走那条分支就等于「只改索引的 PR 一律放行」，
          # 整条审核链被一次手抄 json/modules.json 绕过。
          if [ "${INDEX_PR:-}" = "true" ]; then
            if [ "${DERIVED:-}" = "true" ]; then
              echo "批准：索引重建 PR，内容与「base 索引 + 被消费的已批准条目 + head 上的处置台账」的推导逐字段一致。"
              exit 0
            fi
            {
              echo "::error::未获批准：这是索引重建 PR，但索引与 base 的推导结果不一致，或被消费的条目拿不到批准证据。"
              echo "::error::索引只能由 build-index.mjs 从 pending 推导，不接受手改；要下架请走 revoke 流程。"
            } >&2
            exit 1
          fi
          # 动了台账的 PR 排在这里，且**必须排在下面那句「没有投稿内容 ⇒ 无批准事项」之前**。
          # 理由不是推演，是 #53 那条 canary 在线上的读数：那次 kind 判了 index_pr=false，
          # 于是这一步走到「无批准事项」exit 0，PR 上挂着**一枚绿勾 + 一份被改写的黑名单**。
          # 自动合并确实被挡住了，但「绿勾」这个东西人是会点的 —— 光挡住机器不够，得让它红。
          # 证据由 derive 那一步取（两名 OWNER/MEMBER 的 #human-approved，且每条新增/改动的
          # by 回访得到其中一个人的真评论）；这里只读它导出的那一个布尔，不在这里再判一遍。
          if [ "${LEDGER_PR:-}" = "true" ]; then
            if [ "${LEDGER_SEALED:-}" = "true" ]; then
              echo "批准：这次处置台账改动有两名有仓库写权限的人的签名，且每条新增/改动的 by 都回访得到其中一个人的评论。"
              echo "（合并由 merge-index 走 ledger 那一支：它还会按此刻的 main 重推导一遍，并在合完立刻 purge CDN。）"
              exit 0
            fi
            {
              echo "::error::未获批准：这条 PR 动了 json/dispositions.json，而处置署名不成立。"
              echo "::error::要求是：两名不同的人在本 PR 评论**首行**写 #human-approved（签名的人得对这个仓库有 write/admin —— CI 逐个查 permission，不吃 author_association：那字段按请求者算），"
              echo "  且每条新增/改动的处置的 by 要能回访成这两人之一的真评论 —— 见 derive 那一步的输出与 report 里的 seal 一格。"
              echo "::error::为什么不能只靠「推导结果对得上」：重算是拿公开仓库里同一份 build-index.mjs 就能自己做出来的，"
              echo "  一致只能证明内容自洽，证明不了有人看过这条处置（2026-10-17 本地复现打出的四格全是这个形状）。"
            } >&2
            exit 1
          fi
          # 没有待审投稿内容 = 没有批准事项。删除 pending、改脚本/文档这类 PR 必须能正常走，
          # 否则 required check 会把所有维护类 PR 一起卡死（而它们的 check 永远不会发生）。
          if [ "${FOUND:-}" != "true" ]; then
            echo "本 PR 里没有待审投稿内容（found=${FOUND:-<空>}），无批准事项 —— 不代表其中任何投稿获准。"
            exit 0
          fi
          if [ "${ACTION:-}" = "auto-approve" ] && [ "${LABEL:-}" = "auto-approved" ]; then
            echo "批准：${MODULE_ID:-?} risk=${RISK:-?} changeType=${CHANGE_TYPE:-?}"
            echo "依据：${REASONS:-（无）}"
            exit 0
          fi
          {
            echo "::error::未获批准：action=${ACTION:-<空>} label=${LABEL:-<空>} risk=${RISK:-<空>} changeType=${CHANGE_TYPE:-<空>}"
            echo "::error::依据：${REASONS:-（无）}"
            echo "::error::本 PR 不满足自动放行条件，需人工审核后走双签盖章流程（见仓库根 GOVERNANCE.md：两名有仓库写权限的人各在 PR 评论首行写 #human-approved）。"
          } >&2
          exit 1

  # -------------------------------------------------------------------
  # 只做一件事：把已获批准的 PR 合进 main。索引不在这里生成。
  #
  # 为什么不在这里往 main 推索引提交，也不改成「先往 PR 分支写索引、再合并 PR」：
  #   * 后者那次索引提交落在 pending/** 上，会触发 synchronize 把审核再跑一遍，
  #     而新 head sha 的 required check 还没出结果时 `gh pr merge` 本身就过不去 ——
  #     两个坑互锁，我在实现上一版方案时撞死在这里；
  #   * 前者意味着 main 上永远不能开「require a pull request / restrict pushes」，
  #     于是任何人都能用一次 push 绕过整条审核链。
  #
  # 拆成两段之后的不变式很干净：**main 的唯一入口是「合并一个 approve 成功的 PR」，
  # 索引是 main 内容的函数**（重建见 .github/workflows/index.yml）。
  #
  # 代价是章不能再由 publish 现场盖：合并进 main 的 pending JSON 上没有审核结论，
  # 所以下游必须回头取证据。index.yml 走的是「查那次 approve check 的结论」，
  # 不读标签（有 triage 权限就能加）、不读评论（投稿者和模型都能影响它）、
  # 也不假设分支保护肯定已经配好（配置能被别人关掉，而结论改不了）。
  # -------------------------------------------------------------------
  publish:
    name: Merge Approved PR
    needs: [audit, approve]
    # 两个条件都要：approve 在「没有待审投稿内容」时也成功（那是给维护类 PR 让路的），
    # 而合并只应该在「确有投稿且获自动放行」时发生。少写 found 这一半，
    # 就等于任何改了 pending/** 的 PR 都能被机器人自动合进 main。
    if: needs.audit.outputs.found == 'true' && needs.audit.outputs.action == 'auto-approve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 合并与「把结果贴回 PR」都要写 PR；job 级 permissions 会整体覆盖顶层，
      # 少这一行 gh pr merge 与 createComment 都会 403。
      pull-requests: write
    steps:
      - name: 合并
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODULE_ID: ${{ needs.audit.outputs.module_id }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::这次运行不是来自 PR（workflow_dispatch 只能重跑扫描，合并要人工确认）。"
            exit 1
          fi
          # squash：投稿的 pending 条目与它的审核记录合成 main 上的一个提交，
          # 之后 index 从这一个提交回溯到同一个 PR —— 追溯链不留「分支上还有谁的改动」这种悬念。
          # 合并失败最常见的原因是保护/规则不允许 Actions 这个 actor 合并，报错直接抛出来，
          # 不要静默：模块没进索引时必须看得见。
          gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash
          echo "已 squash 合并 #${PR_NUMBER}（${MODULE_ID:-?}），索引由 push 触发的 Rebuild Index From Main 生成"

      - name: 告知合并结果
        uses: actions/github-script@v7
        env:
          MODULE_ID: ${{ needs.audit.outputs.module_id }}
        with:
          script: |
            // 合并 != 已入索引。这一步把两件事的先后讲明白，否则投稿者会在
            // 「PR 已合并」之后看不到索引变化而以为流水线坏了。
            const branch = context.payload.repository.default_branch;
            const body = `## 已合并，索引稍后重建\n\n`
              + `本 PR 已由审核流水线 squash 合并进 \`${branch}\`（批准依据：\`approve\` check 在该 head sha 上为 success）。\n\n`
              + `- 模块 id：\`${process.env.MODULE_ID || '(未知)'}\`\n`
              + `- 索引条目由 **Rebuild Index From Main** 这个 run 生成，它由本次合并触发的 push 启动；\n`
              + `- 那一步会在 main 上回查 \`approve\` 的结论才盖审核章，所以它失败时模块**不会**进索引，`
              + `原因写在那个 run 的日志里，也会贴回本 PR。\n`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # -------------------------------------------------------------------
  # 索引重建 PR 的合并只能发生在这里 —— 位置不是随便挑的。
  #
  # org 那个「不允许 GitHub Actions 创建/批准 PR」的开关，同时管住了「在一个与目标 PR
  # 无关的 run 里合并 PR」。index.yml 由 workflow_run / workflow_dispatch 触发，它拿到的
  # GITHUB_TOKEN 去合索引 PR 会拿到：
  #   GraphQL: Resource not accessible by integration (mergePullRequest)
  # 实测（run 38069741398 → 索引 PR #19）。而同一个 token 在 publish 作业里合**自己这条**
  # 投稿 PR（#15）是成功的 —— 唯一区别就是 run 的触发上下文。
  #
  # 所以把合并放回 pull_request 上下文就通了，而且没多开任何口子：判据仍由同一条链上的
  # kind/derive/approve 产出，凭据仍是 GITHUB_TOKEN，App 只负责写分支开 PR。
  #
  # 两个条件都要：
  #   * index_pr —— 这条 PR 只动索引；少了它，任何改 scripts/docs 的维护 PR 也会被机器人合掉；
  #   * index_derived —— 索引内容 = base 的推导结果（verify-index-pr.mjs 逐字段比过）；
  #     少了它，手抄一份 json/modules.json 就能进 main —— 那正是整条链唯一在防的事。
  # needs: approve 还额外保证「approve 红了就绝不合并」：job 默认要求 needs 的 job 成功。
  # -------------------------------------------------------------------
  merge-index:
    name: Merge Index PR
    needs: [audit, approve]
    # 两条机器路由，都要 index_derived（内容确由 base 推导），差别只在批准证据是哪一半：
    #   index_pr  —— 消费了有外部批准证据的 pending（投稿收录）
    #   ledger_pr —— 动了处置台账，且 derive 取到了两名有写权限的人的签名（下架 / 拉黑 / 解封）
    # 两个 output 由 kind 步互斥地导出（台账进过 diff 就不可能是 index_pr），所以这里不必再防「两个都真」。
    # 写成 `index_pr || (ledger_pr && ledger_sealed)` 而不是把 ledger 那半并进第一个合取项：
    # 少了 ledger_sealed 这一格，自动合并就又回到「内容自洽就够了」那个被打穿的形状。
    if: needs.audit.outputs.index_derived == 'true' && (needs.audit.outputs.index_pr == 'true' || (needs.audit.outputs.ledger_pr == 'true' && needs.audit.outputs.ledger_sealed == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 检的是 PR head 本身，不是 GitHub 默认的 merge ref：要比的「这条索引提交从哪个 main
      # 分出来」只有 head 的历史里有答案。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------------------------
      # 过期索引 PR 的防护。
      #
      # 为什么需要它：`approve` 绑的是 head sha —— head 不动，那次推导判定的结论就一直挂着绿。
      # 而 derive 比的是「PR 创建时」的 base。如果这期间 main 又前进了（比如又合了一条投稿），
      # 这条 PR 的内容就已经不是当前 main 的函数了，合下去会把更新的索引退回去。
      #
      # 为什么不开 ruleset 的 strict_required_status_checks_policy：那是全局的，会同时要求
      # **投稿 PR** 也必须分支最新才许合 —— 投稿方是不会 rebase 的机器人，两条投稿挨着进来
      # 就会把前一条永久卡死（本轮实测：祖先检查冻死机器人投稿是同一个形状）。所以只在这条
      # 链上补，不动全局保护配置。
      #
      # 判据沿用 derive 那一条，只是把 base 换成**此刻的 main**：索引内容仍然 ==
      # buildIndex(当前 main, 本 PR 消费掉的 pending) 才合。
      #   * main 这期间只进了维护类改动 → 推导结果不变 → 照样合（不会误伤）；
      #   * main 这期间进了新投稿 → 新 pending 会出现在 base..head 的删除里，而这条 PR 的索引
      #     没有它 → 判不一致、不合。那条新投稿自己会触发一次重建，开出覆盖两者的新索引 PR。
      # -------------------------------------------------------------------
      - name: 按当前 main 重推导一遍，只对得上才合
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FORCE_PREFIX: ${{ vars.MODULE_REPO_PREFIX || '' }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ]; then
            echo "::error::这次运行不是来自 PR（dispatch 只重跑判定），索引合并要人工确认。"
            exit 1
          fi
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::拿不到 PR 编号，重推导入不了处置署名 —— 按不成立处理，不在这里合。"
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" >/dev/null 2>&1
          BASE_SHA="$(git rev-parse "refs/remotes/origin/${BASE_REF}")"

          PREFIX="$FORCE_PREFIX"
          if [ -z "$PREFIX" ] && [ -d contrib/repo/pending ]; then PREFIX="contrib/repo"; fi
          PENDING_DIR="${PREFIX:+$PREFIX/}pending"
          INDEX_FILE="${PREFIX:+$PREFIX/}json/modules.json"
          DISPOSITIONS_FILE="${PREFIX:+$PREFIX/}json/dispositions.json"
          SCRIPTS_DIR="${PREFIX:+$PREFIX/}scripts"

          echo "重推导：base=${BASE_SHA:0:8}（此刻的 ${BASE_REF}），head=$(git rev-parse --short HEAD)"
          # --pr 必须带上：动了台账的那一半判据（两名有写权限的人的签 + by 回访）在这里再取一次，
          # 用的仍是同一个脚本、同一套判据。不带 --pr 就等于台账类 PR 在合并这一步退成
          # 「内容对得上就合」，而签名只在 derive 那一步查过一次 —— 那一步的结论绑的是 head sha，
          # 恰好是这条重推导存在的理由（base 变了要重算），不能当成已经查过。
          node "$SCRIPTS_DIR/verify-index-pr.mjs" --base "$BASE_SHA" --head HEAD \
            --owner "$OWNER" --repo "$REPO" --pending-dir "$PENDING_DIR" \
            --index-file "$INDEX_FILE" --dispositions-file "$DISPOSITIONS_FILE" \
            --pr "$PR_NUMBER" \
            --report verify-at-merge.report.json

      - name: 合并（squash：main 上每个索引状态都对应一个过检的 PR）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::这次运行不是来自 PR（dispatch 只重跑判定），索引合并要人工确认。"
            exit 1
          fi
          gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --squash
          echo "索引 PR #${PR_NUMBER} 已 squash 合并：main 上的 json/modules.json 就是这次推导的结果。"

      # -------------------------------------------------------------------
      # 合并之后立刻让 CDN 上那份旧索引失效。
      #
      # 为什么这一步在这条链上，而不是「谁用 CDN 谁自己管」：下架的生效速度实际由 CDN 的
      # TTL 决定，而不是由 main 决定。实测 2026-10-11 —— 索引 PR #34 把索引推空之后近
      # 50 分钟，jsDelivr 上仍然返回下架前的 4 个模块，也就是订阅那个地址的 App 照样能装到
      # 已被下架的包。「索引 = f(main)」在源站上成立，在用户手里不成立。
      #
      # 失效方向：合并已经发生，这一步红不撤销任何事，只是把「缓存还在发旧内容」变成看得见
      # 的失败（要红，不要静默 0 —— 静默 0 等于那条下架在用户手里没发生过）。
      # 脚本只内置 jsDelivr 的公开 purge GET；其它镜像一律报「无能为力」而不冻住流水线。
      # -------------------------------------------------------------------
      - name: 让 CDN 上那份旧索引立刻失效
        shell: bash
        env:
          # repo variable 不会自动变成环境变量，得显式传 —— 否则 README 里写的
          # 「其它镜像放进 CDN_PURGE_URLS」是一条配了也不生效的死配置。
          CDN_PURGE_URLS: ${{ vars.CDN_PURGE_URLS }}
        run: |
          set -euo pipefail
          node scripts/purge-cdn.mjs

